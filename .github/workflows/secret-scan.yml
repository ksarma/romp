name: Secret scan

# The credential scan on every push to this repository, of a branch or a tag, whose commit carries
# this file, and on every push to an open pull request's branch (2026-09-30). ci.yml, whose secrets
# job runs the same scan, runs only on a push to a batch branch, by hand and on its weekly schedule
# (2026-09-27). Without this workflow a push the pre-push hook did not scan (the list in CLAUDE.md,
# "Credentials") waited for the next of those runs, and a commit that left every branch before one
# (force-pushed over, or on a deleted branch) was never scanned by CI, though GitHub still serves it
# by its sha.
#
# Which pushes start a run: GitHub reads a push's workflows from the commit the push puts on its ref,
# and a pull request's from the merge commit it makes of the PR's head and its base
# (refs/pull/<n>/merge), which carries the base's copy of this file. The pull_request trigger takes
# GitHub's three default types, the ones that give a PR a head to scan: opened, synchronize (a push
# to the PR's branch) and reopened (GitHub's docs do not say that a push made while a PR is closed
# starts a run of this trigger, so this header counts it as starting none; the reopened PR's run
# reads it). The other types (edited, labeled and the rest) move no head. It has no branch filter,
# which under pull_request would select the base branch, so a PR onto another PR's branch is scanned
# as one onto main is. So a push to an open PR's branch is scanned twice, once by each trigger, when
# the branch's commit carries this file, and once, by the pull_request trigger, when only the base
# carries it because the branch never had it (a branch cut from main before this file landed, or cut
# from the project this repository forked). A PR from another repository is scanned once for each
# push, by a pull_request run, since its pushes go to that repository, whatever its head carries
# unless the head deletes this file. When a PR's branch and its base both lack this file (both cut
# before it landed), its merge commit carries an older ci.yml, whose secrets job, Secret scan
# (gitleaks), runs on pull requests (main's copy before this file landed runs it, and so does the
# project's), though that copy cancels a PR's run in progress when a newer push to the PR arrives.
# Three kinds of push start no run: a push to a branch cut before this file landed that has no open
# PR, until it merges main; a tag on such a commit; and a push whose commit lacks this file because
# it or an earlier commit on its branch deleted it, since the PR's merge commit lacks it as well. A
# push that edits this file runs its edited copy, under both triggers. A commit only such a push
# carries is scanned by the next run whose checkout reaches it, and by none if it leaves every
# branch and tag first.
#
# The pull_request trigger has three limits of GitHub's own: it starts no run while a PR conflicts
# with its base (GitHub makes no merge commit until the conflict is resolved); a first-time
# contributor's PR from another repository may wait for a maintainer to approve its run (the
# repository's setting for approving runs from fork PRs); and on a private repository a PR from
# another repository runs no workflow unless the repository's setting for fork PRs allows it. Such a
# PR's commits are scanned by a push run when a branch here holds them and its commit carries this
# file, and otherwise by the first pull_request run after the conflict is resolved, the run is
# approved or the setting is turned on, while the PR's head still holds them.
#
# What a run scans: actions/checkout at depth 0 fetches every branch and tag and checks out the commit
# the event names. On a push that is the commit the push put on its ref; when that ref has moved on
# or been deleted by the time the run starts, it fetches that commit by its sha instead, so a commit
# force-pushed over before its run is still the run's HEAD. On a pull request it is the merge commit,
# whose second parent is the PR's head, so the PR's commits are read even when no branch here holds
# them. The history scan reads HEAD and every branch and tag the checkout fetched, with all their
# ancestors, and the tree scan reads HEAD's files.
#
# The job is ci.yml's secrets job: tests/test_ci_secret_scan.py holds the two equal, every key but
# the name (runs-on, permissions, timeout-minutes, steps with their env and flags), so change both
# together. The reasons for each step are in ci.yml's comments. The name differs on purpose: on a
# batch push both jobs report on the same commit, and GitHub matches a required status check by job
# name whatever the workflow, so one name for two jobs would let either meet a rule that names it.
# scripts/batch.py land reads only the jobs of ci.yml's own run of the batch push, by that run's id,
# so this job does not count toward a landing under either name.
#
# No concurrency group: each run completes. A run cancelled by the next push to its branch would leave
# the first push's commits unscanned if the second push dropped them.
#
# Three more limits are GitHub's: a skip instruction in the commit message of a push's commit or of a
# PR's head commit ([skip ci] and the like, or a skip-checks: true trailer) starts no run of either
# trigger, a push of more than three tags at once creates no event for the tags, and a push of more
# than 5,000 branches at once creates no event.
#
# Cost: a public repository is not billed for it. A private one is billed about 3 minutes a run, each
# job rounded up to a whole minute: 2 to 5 measured (the secrets jobs of ci.yml's 40 runs ending with
# run 36720506621, of 2026-09-29 and 30, took 102 to 290 s, 3.1 billed minutes on average, and this
# workflow's run 36716345230 took 136 s), and more as the history grows, since every run reads every
# commit (the same job took 44 to 73 s in its successful runs of 2026-09-11 to 13, the last run
# 34756159247). With the pull_request trigger a push to an open PR's branch whose
# commit carries this file is scanned twice, once by each trigger. A private repository would drop
# the pull_request trigger, keeping one scan a push and giving up the runs for PRs whose branch lacks
# this file (a PR from another repository needs the private-fork setting there in any case).

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  secrets:
    name: Secret scan on push (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan every commit
        run: gitleaks git . --no-banner --redact -v --config .gitleaks.toml --log-opts="--all --diff-merges=first-parent --text"
      - name: Scan the tree as it stands
        if: ${{ !cancelled() }}
        run: gitleaks dir . --no-banner --redact -v --config .gitleaks.toml
