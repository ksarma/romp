name: Secret scan

# The credential scan on every push to this repository, of a branch or a tag, whose commit carries
# this file (2026-09-30). ci.yml, whose secrets job runs the same scan, runs only on a push to a batch
# branch, by hand and on its weekly schedule (2026-09-27). Without this workflow a push the pre-push
# hook did not scan (the list in CLAUDE.md, "Credentials") waited for the next of those runs, and a
# commit that left every branch before one (force-pushed over, or on a deleted branch) was never
# scanned by CI, though GitHub still serves it by its sha.
#
# Which pushes start a run: GitHub reads a push's workflows from the commit the push puts on its ref,
# so a push whose commit lacks this file starts none. That is a branch cut from main before this file
# landed, or cut from the project this repository forked, until it merges main, and a tag on such a
# commit. A push that edits this file runs its edited copy, and one that deletes it runs none. A
# commit only such a push carries is scanned by the next run whose checkout reaches it (below), and
# by none if it leaves every branch and tag first. A pull request from another repository starts no
# run here: its pushes go to that repository, and its commits are scanned once a branch here holds
# them.
#
# What a run scans: actions/checkout at depth 0 fetches every branch and tag and checks out the commit
# the push put on its ref; when that ref has moved on or been deleted by the time the run starts, it
# fetches that commit by its sha instead, so a commit force-pushed over before its run is still the
# run's HEAD. The history scan reads HEAD and every branch and tag the checkout fetched, with all
# their ancestors, and the tree scan reads HEAD's files.
#
# The job is ci.yml's secrets job: tests/test_ci_secret_scan.py holds the two equal, every key but
# the name (runs-on, permissions, timeout-minutes, steps with their env and flags), so change both
# together. The reasons for each step are in ci.yml's comments. The name differs on purpose: on a
# batch push both jobs report on the same commit, and GitHub matches a required status check by job
# name whatever the workflow, so one name for two jobs would let either meet a rule that names it.
# scripts/batch.py land reads only the jobs of ci.yml's own run of the batch push, by that run's id,
# so this job does not count toward a landing under either name.
#
# No concurrency group: each push's run completes. A run cancelled by the next push to its branch
# would leave the first push's commits unscanned if the second push dropped them.
#
# Three limits are GitHub's: a push that carries a skip instruction in its commit message ([skip ci]
# and the like, or a skip-checks: true trailer) starts no run, a push of more than three tags at once
# creates no event for the tags, and a push of more than 5,000 branches at once creates no event.
#
# Cost on a private repository: about 2 billed minutes a push (ci.yml's secrets job took 107 s in
# run 36664031774). A public repository is not billed for it.

on:
  push:

jobs:
  secrets:
    name: Secret scan on push (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan every commit
        run: gitleaks git . --no-banner --redact -v --config .gitleaks.toml --log-opts="--all --diff-merges=first-parent --text"
      - name: Scan the tree as it stands
        if: ${{ !cancelled() }}
        run: gitleaks dir . --no-banner --redact -v --config .gitleaks.toml
