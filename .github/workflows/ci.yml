name: CI

# Run the test suites that gate romp: the Python pipeline (kernel/, cli/,
# postal/), the shell surfaces (hooks / postal / manager), and the VS Code
# extension build; and scan the whole history for credentials (the secrets job).
#
# LINUX runs on every push to a batch branch (batch/**) and by hand; the weekly schedule that also
# ran it is paused (see `on:`). Member PRs and merges to main run none of it (2026-09-27; a copy of
# the secrets job runs on each push whose commit carries secret-scan.yml, and that file's header says
# why and which pushes start no run of it):
# the local sweep (scripts/sweep.py) recorded at the batch head is the landing gate, and
# scripts/batch.py land refuses a batch whose head does not contain main, reading main again right
# before the merge, so the merge commit's tree is the batch head's tree, the one this workflow tested
# on the batch push; a move of main after that last read is not stopped, and batch.py finish reports
# it loudly from the merge commit's first parent (docs/batching.md).
# Cost: a public repository is not billed for these runs. A private one is billed for each run by
# the job-minute, each job rounded up to a whole minute, and this repository moves to a private one
# (approved 2026-10-04) whose runner, the private runner here, has 2 CPUs and 8 GB, where the public
# runner has 4 CPUs and 16 GB. Run 36716348831, a dispatch of 2026-09-30, ran on the public runner;
# by that rule its Linux jobs come to 214 minutes, all of this workflow a batch push runs (211 in the
# dispatch before it, run 36664031774). On the private runner each Linux Python interpreter runs as
# SHARD_COUNT jobs (tests/conftest.py), four today, each running one worker over one shard of the test
# files: two workers peak at 10.9 GB (the Run pytest step gives the measurement), and one worker
# running the whole suite outgrew 8 GB in a local run, as did the larger of two shards, the largest
# of three passed the 5 GB a shard's worker is held to, and so did one of four by the hash alone,
# which is why the shards follow a weighted rule (the python job's cap comment gives those
# measurements; this file ran the cells on one worker each, on the premise that one worker fits,
# until the first of them). The estimate (four shards at the weighted rule, 2026-10-05): each shard
# job is that shard's measured one-worker phase (the python job's cap comment: 3.12's own for 3.12,
# 3.14t's own for 3.14t, and the slower of the two for 3.10, 3.11 and 3.13) plus the time before and
# after the Run pytest step in that interpreter's cell of run 37212676524 (batch/2026-10-04b, 18 to
# 27 s before and 2 to 3 s after), each job rounded up to a whole minute: 12, 25, 11 and 21 or 22
# minutes for an interpreter's four shards (10, 21, 11 and 21 for 3.12; 12, 25, 8 and 21 for 3.14t),
# 337 for the twenty shard jobs (352 for the fifteen jobs of three shards). The other Linux jobs at
# their times in that run, on the public runner: 50 for Served pages, 41 for Shell, 15 for Vendored
# tooling, 7 for vscode-extension and 3 for the secrets job, 116 minutes (95 in run 37179700919, 111
# in run 37128151383). With secret-scan.yml's copy, about 3 minutes (below), a batch run bills about
# 456 minutes (471 with three shards). At 0.006 dollars a minute, GitHub's posted rate for its Linux
# 2-core x64 runner (read 2026-10-05), that is about 2.74 dollars a run. The fork had 30 CI runs on
# batch branches in the 30 days to 2026-10-04 and none in the 30 days before (23 in September; 27
# since 2026-09-21, when batches began to land daily, about 58 a month at that rate), so about 82
# dollars a month at 30 runs and about 159 at 58. A manual run, Linux alone by default (below), bills
# about 453 minutes, about 2.72 dollars, and at last month's pace of 29 manual runs that is about 79
# dollars a month, so about 161 dollars a month for this workflow at 30 batch runs and about 238 at 58.
# The repository's other workflows add about 5,200 minutes a month at the pace of the week to
# 2026-10-04, about 31 dollars (tests/test_ci_cost_estimate.py holds these sums to their inputs):
# secret-scan.yml on each push that is not a batch push, about 910 a month (212 in that week, counted
# as this workflow's pull_request runs on branches other than batch branches, 199, and its runs on
# pushes to main, 13, while main's copy of this file ran on both), at 3 billed minutes a run (75 over
# its 25 runs in that week), about 2,730 minutes; pr-tier.yml on each pull request opened, reopened,
# labeled or unlabeled, 534 runs in that week at 1 billed minute each (all 45 sampled), about 2,290
# minutes a month; ledger.yml, pr-orphans.yml and docs.yml on pushes to main, 36 runs and 43 billed
# minutes in that week, about 180 minutes a month; and tier-policy.yml, whose one job is skipped
# outside the project's repository (its job-level if:), so its runs bill nothing. So about 192
# dollars a month in all at 30 batch runs and about 269 at 58. These dollars are the list price of
# every minute: the owner of a private repository pays only for the minutes past its plan's included
# allowance, which GitHub documents as 50,000 minutes a month for Enterprise Cloud, on standard
# GitHub-hosted runners such as these (read 2026-10-05). That allowance is charged to the
# repository's owner, so the owner's other private repositories draw on it too, and this
# repository's estimate, about 32,000 to 44,800 minutes a month (30 to 58 batch runs at 456, 29
# manual runs at 453 and the other workflows' 5,200), would use a large part of it. The times of this
# workflow's other Linux jobs are the public runner's, on 4 CPUs and 16 GB. A local measurement on
# 2026-10-05, under a systemd CPUQuota of 200 percent against 400 percent, found their longest steps
# barely slower on 2 CPUs: a sample of the served-page tests ran 539 s against 554 s, and two samples
# of the bats suites ran 9 percent longer and 17 percent shorter (the second moved by the machine's
# load). Two things are not measured: the private runner's 8 GB memory limit and its speed per core.
# The first private batch run confirms the Served pages and Shell caps, as it does the shard caps. The
# estimate made for one worker per cell, before the first measurement: by the serial ratio measured on
# four CPUs (1437 s against 739 s) the cells of
# run 36716348831 would take about 40 to 53 minutes each, and those of run 37158350467 about 61 to
# 74, so a batch run's Linux jobs would bill about 325 minutes by run 36716348831 and about 444 by
# run 37158350467, whose Linux jobs bill 279 on the public runner (each cell's pytest step scaled by
# that ratio, every other job at its public time). The first batch push on the private runner gives the
# measured and billed figures. The same push also runs secret-scan.yml's copy
# of the secrets job once, for the push (that file has had no pull_request trigger since 2026-10-04),
# about 3 minutes a run (2 to 5 measured, and more as the history grows; that file's header gives the
# runs). A manual run (workflow_dispatch) runs the Linux jobs alone by default, the jobs a batch push
# runs but secret-scan.yml's copy, about 2.72 dollars by the estimate above. With its macos input on (2026-10-05; the on: block
# says why it is off by default) it adds the macOS cells: 132 runner minutes in run 36716348831,
# billed at about ten times the Linux rate, so about 1,320 Linux minutes' worth, about 8 dollars,
# and a floor: the 3.13 cell was cancelled at its 60-minute cap, the 3.10 cell
# ended 52 minutes into its pytest step when the per-test timeout stopped its in-process run on a
# test that hung (the same hang is in main's macOS runs), and the bats cell failed 11 s into its
# test step without running a test (bats could not gather the tests: macOS's bash 3.2 rejected the
# file-scope `declare -gA` that tests/pre-push-hook.bats had then; fork PR 937 has since moved it
# into a helper, and the file now loads under bash 3.2), where a run that gets through the suite
# takes as long as 48 min 1 s: that is the slowest macOS bats job among the finished runs on main,
# the batch branches and the branches of the open and merged PRs (the runs the Shell job's cap
# comment reads), in run 37045964763 (a dispatch of fork PR 940's branch on 2026-10-02, a branch
# that installs gitleaks and a newer bash on macOS, since merged), its time from the jobs API.
# macOS is free too on the standard macOS runners of a public repository (2026-09-17;
# an earlier note here said it was billed), but the macOS cells are slow (a macOS bats
# job alone has taken 48 min 1 s, above) and the runners are scarcer, so they do NOT run
# on every push. From 2026-09-16 they also ran once a week on a schedule; that run is paused until
# the first month's bill on the private runner is read (see `on:`). They run on a
# manual run that asks for them: tick the macos box in the Actions tab's "Run workflow"
# form, or run `gh workflow run CI --ref <branch> -f macos=true`. Ask for them when you
# want a cross-platform check before a release (scripts/release.sh's gate dispatches
# with the input on) or after touching a platform-sensitive surface (launchd, the
# folder opener, the CLI scope).
# On a macOS dev box, the pre-push hook runs the same suites locally, so the
# common macOS-only breakages (a real browser opening, a GNU-only flag)
# are caught before the push rather than waiting on this manual run.
#
# Python spans 3.10 (the floor docs/install.md promises) through 3.13 (the dev
# version), plus free-threaded 3.14t with the GIL off (the kernel's builders, judge
# tiers and handlers are threads, and only there do they run at once); the older
# versions and the free-threaded cell run on Linux only, since a version gap and
# a platform gap rarely fail the same way.

on:
  push:
    # Pushes to a batch branch, nothing else (2026-09-27). A member PR runs none of this workflow: the
    # local sweep (scripts/sweep.py) at the batch head is the landing gate, and this workflow runs
    # once on the batch branch, whose PR is expected to show that run's checks on its head (the first
    # batch confirms it: docs/batching.md, "Checked on the first batch"). A merge to main runs none
    # either: scripts/batch.py land refuses a batch whose head does not contain main, reading main
    # again right before the merge, so the merge commit's tree is the tree this workflow already
    # tested on the batch push; a move after that read is finish's loud report. pull_request
    # is not a trigger: its branch filter selects the BASE branch, so picking out batch PRs there
    # would take a job-level `if:`, and a skipped job reports success.
    branches: ['batch/**']
  workflow_dispatch:   # the manual run; its macos input, off by default, adds the macOS cells (below)
    # The macos input (2026-10-05): a manual run runs the Linux jobs alone unless the input is true. To ask for the
    # macOS cells, tick the box in the Actions tab's "Run workflow" form, or run `gh workflow run CI --ref <branch>
    # -f macos=true`. The reason is cost control, as for the paused weekly run: the macOS cells bill at about ten
    # times the Linux rate, about 8 dollars of macOS minutes a dispatch by the header's figures (132 runner minutes in
    # run 36716348831, a floor), where a run's Linux jobs come to about 3 dollars. Each matrix job's os: expression
    # selects macOS on a dispatch only when the input is true, and never on a batch push; the schedule event still
    # selects it (tests/test_ci_macos_input.py holds the input and the gate). scripts/release.sh, whose release gate
    # is the macOS run, dispatches with the input on.
    inputs:
      macos:
        description: 'Also run the macOS cells (about 8 dollars of macOS runner minutes a run)'
        type: boolean
        default: false
  # The weekly schedule is PAUSED (2026-10-04) until the first month's bill on the private runner is
  # read. On a private repository every run is billed, and the scheduled run would add its Linux jobs
  # and the macOS cells, which bill at about ten times the Linux rate (about 1,320 Linux minutes' worth
  # in run 36716348831, the header's figure), every week. While it is paused, nothing runs on a
  # schedule, a batch push runs the Linux jobs alone, and a manual dispatch runs the Linux jobs and,
  # when its macos input is true, the macOS cells. Each matrix expression below still names the
  # schedule event, so un-commenting the two lines at the end of this comment restores the weekly run
  # as it was, the macOS cells included (tests/test_ci_macos_schedule.py holds both).
  # From 2026-09-16 the macOS cells ran ONCE A WEEK on their own: with the manual switch alone the
  # release gate was the first macOS run in two weeks, and it found twenty-nine failures that had
  # accumulated unseen. One run at a quiet hour Pacific (Monday 10:00 UTC is 03:00 Pacific in summer,
  # 02:00 in winter); the manual dispatch stays for the release day and for a platform-sensitive change.
  # schedule:
  #   - cron: "0 10 * * 1"   # weekly macOS cells: the scheduled run selects the matrix a dispatch with macos on does

# A newer push to a BATCH BRANCH cancels the older in-flight run on that branch:
# a rebuild's new head supersedes the old one, whose verdict nobody reads and
# whose minutes would still be spent. The event is part of the key on purpose: a
# dispatch (the macOS gate with its macos input on, on main or on a batch branch) is keyed apart from
# that ref's pushes, so a push never cancels it; a bare ref key let an
# auto-merged PR cancel the in-flight release run mid-watch (2026-07-27).
# main is not a push trigger (see `on:`), but the group still keys a push to
# main on the commit sha and never cancels it, so adding main back cannot bring
# back what that rule fixed: main's CI must never cancel itself. With one group
# per ref, two merges in quick succession cancelled the first merge's run, and
# a red main (2026-09-08) went unseen until a later run happened to fail; a
# queue would not do either, since a group holds at most one pending run and a
# third merge would replace the second's. A dispatch queues rather than cancels
# for the same reason: a release gate mid-watch is not superseded by a second
# dispatch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/batch/') }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }}${{ matrix.os == 'ubuntu-latest' && format(', shard {0}', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # Every job is time-boxed. Without this a test that BLOCKS (waiting on a socket,
    # a prompt that never comes) burns the 6h default before
    # anyone finds out, and a required check that hangs blocks merges silently.
    # T230b follow-up (the review's catch): the job cap must EXCEED the pytest phase plus the
    # 600 s per-test timeout plus setup, or a stall that begins late in the run is killed by
    # this cap first - the identical silence the per-test timeout exists to end. On 2026-09-03 the
    # measured pytest phases ran 160-300 s, so 15 min left ~100 s of headroom and 25 min was
    # 300 + 600 + setup with margin for a slow runner. The macOS cells (a manual dispatch, and the
    # weekly schedule until its pause) run the same suite on the image's slower runners, and the suite grows with
    # every merge: 17 to 26 minutes on 2026-09-16 (the 3.10 cell cancelled at 25 min 27 s under a
    # 25-minute cap), 33 to 35 minutes on the dispatch of 2026-09-24 03:48 UTC, and on the release
    # dispatch five hours later (run 35976250043) the 3.13 cell finished green in 38 min 52 s while
    # the 3.10 cell was cancelled at 40 min 20 s by the 40-minute cap with no failure in its log,
    # having reached 90 percent 36 min 40 s into its pytest step; the 3.13 cell's pytest step ended
    # about 5.5 minutes after its own 90 percent, so the 3.10 suite sat near 42 to 43 minutes and
    # the rule gave 53 to 54. macOS gets 60, the pin's ceiling (past an hour a hung cell eats the
    # dispatch); on the dispatch of 2026-09-30 (run 36664031774) the macOS 3.10 and 3.13 cells were
    # both cancelled at this cap, 3555 s and 3598 s into their pytest steps, so the macOS suite now
    # runs longer than the ceiling allows.
    # Linux: each interpreter runs as SHARD_COUNT jobs (tests/conftest.py), four today, one for each shard of the test
    # files (the matrix's shard axis below; tests/conftest.py's CI's shards section states the rule that puts each file
    # in one shard), and each job runs ONE worker over its shard on the private runner (2 CPUs and 8 GB; the Run pytest
    # step says why). The shards exist because one worker running the whole suite does not fit 8 GB. A local measurement
    # on 2026-10-04 found it: the Run pytest step's command at this branch, on a fresh checkout, under a systemd
    # CPUQuota of 200 percent and an 8 GiB memory cap with no swap, on a shared machine whose 1-minute load was 62 at
    # the start and 36 to 44 at the end, outgrew the cap. The one worker reached 8 GiB and was killed by the memory cap,
    # once in the 3.12 run and twice in the 3.14t run (xdist started a new worker each time and failed the test it was
    # running; the worker was about 7.2 GB resident at 81 percent of the suite), so the runs' phases, 4283 s and 4411 s,
    # include those restarts, and 8 GB does not hold one worker of this suite. This file ran the cells on one worker
    # each, on the premise that one worker fits, until that measurement.
    # Two shards did not fit either. Measured the same way on 2026-10-05 (1-minute load 21 to 54), shard 1's pytest
    # phase was 1098 s on 3.12 and 1211 s on 3.14t, its worker peaking at 4.01 and 4.51 GB resident, but shard 2's
    # worker reached 6.66 GB resident on 3.12 (the scope's peak, page cache included, 6.92 GB), past the 6 GB a shard
    # may take on an 8 GB runner, which leaves the rest to the runner's own system. So the count went to three.
    # Three shards fit, with too little room. Measured on 2026-10-05 the same way: the Run pytest step's command at this
    # branch with the cell's ROMP_TESTS_SHARD, on a fresh checkout, under a CPUQuota of 200 percent and an 8 GiB memory
    # cap with no swap, with bats, zsh, gitleaks and perf off PATH as on the runner, on a shared machine whose 1-minute
    # load was 27 to 80. The pytest phase on 3.12 and on 3.14t, then the worker's peak resident memory on each (the
    # scope's peak, page cache included, in brackets): shard 1, 661 s and 678 s, 2.99 and 3.05 GB (3.16 and 3.24); shard
    # 2, 930 s and 981 s, 3.04 and 2.89 GB (3.82 and 3.32); shard 3, 2348 s and 2459 s, 5.38 and 5.60 GB (5.57 and
    # 5.81). No worker was killed. By the rule below the three phases gave caps of 25, 30 and 55 (678 + 600 + 27 =
    # 1305 s, 981 + 600 + 27 = 1608 s and 2459 + 600 + 27 = 3086 s). Shard 3's worker was over 5 GB, the target set on
    # 2026-10-05 for each shard's worker, which keeps about 1 GB of the 6 GB for the files' growth, so the count went to
    # four.
    # Four shards by the hash alone did not meet the target either. Measured the same way on 2026-10-05 (1-minute load 14
    # to 61), the pytest phase on 3.12 and on 3.14t, then the worker's peak on each (the scope's peak in brackets): shard
    # 1, 553 s and 559 s, 2.32 and 2.30 GB (2.55 and 2.64); shard 2, 1482 s and 1438 s, 2.64 and 2.71 GB (3.56 and
    # 3.35); shard 3, 661 s and 466 s, 2.31 and 2.47 GB (2.42 and 2.60); shard 4, 1145 s and 1222 s, 4.72 and 5.13 GB
    # (4.86 and 5.28). One module put shard 4 over: tests/test_thread_stop_census.py raised its worker's peak by 2.41 GB.
    # So the shards follow a weighted rule (tests/conftest.py's CI's shards section): that module is listed for shard 1,
    # whose worker held the least where it runs, and every other file keeps its hash shard.
    # Four shards at the weighted rule fit, each worker at or under 5 GB on both interpreters. Measured the same way on
    # 2026-10-05 (1-minute load 15 to 66): shard 1, 529 s and 679 s, 4.25 and 4.60 GB (4.41 and 4.79); shard 2, 1220 s
    # and 1451 s, 2.62 and 2.73 GB (3.50 and 3.37); shard 3, 614 s and 409 s, 2.30 and 2.46 GB (2.42 and 2.60); shard 4,
    # 1237 s and 1204 s, 2.74 and 2.75 GB (3.08 and 2.99). No worker was killed in any of these runs. Each phase is
    # pytest's summary figure rounded up to the second, on a shared machine whose load moves it: shard 2 on 3.12 took
    # 1482 s in the hash-alone run and 1220 s in this one, over the same files.
    # Each shard's cap is T230b's rule for its own phase: the shard's one-worker pytest phase, plus the 600 s per-test
    # timeout, plus the time before the step, rounded up to a multiple of 5 minutes, in the expression's matrix.shard
    # clauses, one figure for each shard. Each cap takes the slower interpreter's phase, and the time before the step is
    # the 27 s in the 3.14t cell of run 37212676524 (batch/2026-10-04b, job 111476102341, on the public runner): shard 1,
    # 679 + 600 + 27 = 1306 s, so 25; shard 2, 1451 + 600 + 27 = 2078 s, so 35; shard 3, 614 + 600 + 27 = 1241 s, so 25;
    # shard 4, 1237 + 600 + 27 = 1864 s, so 35. Shard 2's sum is 22 s short of 35 minutes: a slower runner, or a time
    # before the step past 49 s, would give 40. Each cap is the slower of 3.12 and 3.14t, measured locally, and serves
    # 3.10, 3.11 and 3.13 unmeasured. In run 37212676524 the 3.10 and 3.11 pytest steps took 1.31 and 1.25 times 3.12's
    # (1639 s and 1554 s against 1248 s; 3.13's 1422 s is 1.14 times). At those ratios shard 2 (1220 s on 3.12) and
    # shard 4 (1237 s on 3.12) pass 1473 s, the phase past which T230b's rule gives 40, while shards 1 and 3 stay at 25
    # (tests/test_ci_bats_bound.py holds this disclosure to the figures). Each cap is confirmed on the new repo's first CI run, whose jobs give the
    # private runner's own phases and setup times. Each step's time is the jobs API's.
    # 90 is the figure each shard's cap held before the shards were measured. The whole suite's estimated one-worker
    # phase gave it: the slowest finished two-worker Linux cell, the 3.10 cell of run
    # 37208049133 (a dispatch of fork PR 959's branch on 2026-10-04, job 111453304880), 2312 s in its pytest step,
    # scaled by the serial ratio measured on four CPUs (1437 s against 739 s, the Run pytest step's measurement) to
    # 4496 s, and 4496 + 600 + 25 = 5121 s, about 85 min 21 s, so 90 (the 25 s before the step is that job's on the
    # public runner). With two workers on the public runner the same rule gave 50 (the 3.14t cell of run 37158350467:
    # 2276 + 600 + 32 = 2908 s, about 48 min 28 s), the Linux cap from 2026-10-02 to 2026-10-04, after the 40 fork PR
    # 926's branch set on 2026-09-30 from run 36664031774 and the 35 main had before that PR.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || matrix.shard == '1' && 25 || matrix.shard == '2' && 35 || matrix.shard == '3' && 25 || 35 }}
    strategy:
      # One red cell must not hide the others: a 3.10-only break and a
      # macOS-only break look identical if the matrix stops at the first.
      fail-fast: false
      matrix:
        # macOS is in the matrix ONLY on a manual run (workflow_dispatch) whose macos input is
        # true, or on the weekly schedule, which is paused (see `on:`); a batch push, and a manual
        # run with the input left off, get Linux alone. See the billing note in the header.
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.macos) || github.event_name == 'schedule') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # 3.14t is setup-python's spelling for the free-threaded build (see the header).
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14t']
        # The shards: tests/conftest.py assigns each test file to one of SHARD_COUNT shards (its CI's shards
        # section), and the Run pytest step hands it the cell's shard, so it skips the other shards' files. The axis
        # lists 1 to SHARD_COUNT (tests/test_ci_shards.py holds it to the constant, and the shards to a partition of
        # the files).
        shard: ['1', '2', '3', '4']
        exclude:
          # macOS runs 3.10 and 3.13 alone, as before the shards (the header says why), and unsharded (below)
          - os: macos-latest
            python-version: '3.11'
          - os: macos-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.14t'
          # One macOS job for each of those, the shard-1 cell, whose shard value the Run pytest step leaves empty,
          # so it runs every test file under the macOS cap, as before the shards. GitHub reads an exclude entry whose
          # value the os list lacks (a batch push lists no macOS) as matching nothing; confirmed on the new repo's
          # first CI run.
          - os: macos-latest
            shard: '2'
          - os: macos-latest
            shard: '3'
          - os: macos-latest
            shard: '4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # pytest-xdist: the Run pytest step passes -n on every cell, one worker (-n 1) on
        # ubuntu-latest and -n 0, an in-process run, elsewhere, and pytest refuses -n without it
        # (the reasons are on that step).
        run: python -m pip install --upgrade pip pytest pytest-timeout pytest-xdist
      - name: Install cryptography
        # cryptography: the kernel's Web Push soft dependency (plans/ios-app.md). Installed here
        # so tests/test_kernel_webpush.py's crypto layers RUN in CI instead of skipping — the
        # kernel itself still degrades loudly without it (that path has its own test). It ships
        # free-threaded (cp314t) wheels since 46.0, so the 3.14t cell installs it like the rest.
        # The 3.14t allowance below no longer keeps that cell green without it (2026-09-20): the
        # SDK step next requires cryptography through mcp's pyjwt[crypto] and carries no allowance,
        # so a cryptography wheel lagging the interpreter reds the cell there. What the allowance
        # still does is let the failure be named by this step first, where the package is.
        continue-on-error: ${{ endsWith(matrix.python-version, 't') }}
        run: python -m pip install cryptography
      - name: Install the Claude Agent SDK
        # The SDK behind the hosted-session backend, installed at the version the session host is written
        # against: SDK_TESTED_VERSION in kernel/session_host.py, the repo's ONE declaration of it, read here
        # with the sed bin/romp-sdk-setup runs over the same line. With it installed, the SDK-gated tests
        # (in tests/test_sdk_backend.py and tests/test_host_transport.py) and the two SDK-transport host
        # tests in tests/test_session_host.py RUN in CI instead of skipping, and every session host a test
        # spawns takes the SDK transport, as it does on a box with the venv bin/romp-sdk-setup builds (one
        # control in tests/test_session_host.py hides the SDK from its host and keeps the pipe transport tested).
        # Why that version and not PyPI's latest: it is the one the full suite passed under on the box that
        # runs the hosted sessions (16875 passed, 566 skipped, 1 xfailed, 0 failed), and the newer release that existed
        # when this landed (0.2.157, the fifth release in four days) was left alone on purpose: the version is
        # chosen by a run of the host tests, not by the package index. Bumping it is the act the constant's
        # comment describes: install the new version, run the host tests on it, move the number, and the
        # installer, the host's own version check and this step follow the line. The residual is that nothing
        # polls PyPI: a person notices a release, and a break in a newer SDK shows up only when someone moves
        # the constant. A second residual, of the interpreter having the SDK: on the 3.10 to 3.13 cells (and
        # the two macOS cells; not 3.14t, which defers annotations) tests/test_session_host.py run ALONE fails
        # 8 SpawnSecrets tests, its Popen patch live when the module first imports the SDK and mcp's win32
        # utilities evaluate subprocess.Popen[bytes] at class definition; the one pytest invocation below
        # collects an SDK-importing module first and is green. Pre-existing on any such interpreter; the
        # class's docstring has the detail; a follow-up.
        # The constant pins the SDK alone. Its dependency closure resolves fresh on every run (26 packages on
        # 2026-09-20: the 3.12 cell's pip line on run 35518107329 lists 27 names with the SDK, anyio among
        # them), so a red that no commit explains is a transitive release, and the pin test below does not
        # catch one: it compares the SDK's own version and nothing else. One of those packages, anyio,
        # registers a pytest plugin (a pytest11 entry point) that pytest would auto-load in every cell across
        # the whole suite; the pytest step passes -p no:anyio so it does not (2026-09-20). Blocked because:
        # the box's default pytest run never loads it (romp's SDK lives in the venv bin/romp-sdk-setup builds,
        # whose site joins sys.path at tests/test_host_transport.py's import, after plugin autoload, and the
        # box venvs carry no anyio; the one box road that would load it, tests/README.md's PYTHONPATH recipe,
        # which puts that site on the path before pytest starts, passes the same flag), so no pytest process
        # the two checks below read loads a plugin the box's default run does not, unless something loads
        # anyio's plugin again by its entry-point name or its module name (among them -p anyio or
        # -p anyio.pytest_plugin after the flag, PYTEST_PLUGINS, plugins= on pytest.main), which the flag check does not
        # read; on the Run pytest step run_pytest_status refuses a -p re-load on its line as a word outside its option
        # allowlist and PYTEST_PLUGINS in its merged env as a key outside its env allowlist, and on the served-page step
        # and in the launcher census nothing reads them. The flag is on
        # both of this file's pytest lines and on every pytest the suite starts in the cell's interpreter in a
        # form the launcher census reads (tests/test_ci_sdk_pin.py holds both populations, this file's by its population
        # check and the suite's by its launcher census, whose read, refusals and residual _launchers_in's docstring
        # there states in full; among them: it reads argv literals under tests/, the positional arguments of
        # asyncio.create_subprocess_exec and of the os.exec and os.spawn l forms, and an in-process pytest.main,
        # pytest.console_main or _pytest.config.main by name, alias or import; it refuses, red until rewritten, a pytest
        # command in a constant string or f-string written at the call and handed to subprocess, os.system or os.popen,
        # asyncio.create_subprocess_shell, shlex.split or a shell's -c, a call through a name it cannot resolve (in a
        # comprehension in a class body that binds the name, or, beside a star import from a module it does not read,
        # one the module binds or no scope binds, or one a function binds from such a name by a plain or annotated
        # assignment from a name or an attribute), an argv it cannot read as a launcher (an interpreter option it does
        # not take apart before pytest, as in -Bm pytest or -Impytest, -m pytest.__main__, and pytest after a wrapper
        # such as env in an argv written at the call; its argv rule is _argv_command's docstring), and pytest.main held
        # as a value rather than called where it is written (a Thread target, functools.partial, a parameter default, a
        # tuple, a walrus or a conditional expression, among others); and outside its read are a string anywhere else,
        # or one held in a variable or built with %, + or .format, an argv assembled one element at a time, an option it
        # does not take apart that spells no pytest and that no pytest follows, other than a cluster ending in m right
        # before an element that is not a constant, a wrapper-headed argv built away from the call, a call reached
        # through a name the census does not resolve (a string call through tuple unpacking, a conditional expression or
        # a parameter default, an import by name from a module that does not define the call, a relative one included, a
        # class or instance attribute, getattr, importlib or runpy, a builtin or a module name such a star import
        # rebinds, a function's binding from such a name made any other way, a class body's call before the class binds
        # that name, among others), and every module whose text spells neither pytest nor py.test and holds no star
        # import, which the census does not parse). pytest-xdist's two plugins, which the box's default run
        # loads, load in every cell too since batch 917 (#916) installed it there, and xdist hands each worker
        # the command's arguments, so the flag blocks anyio's plugin in the Linux cells' worker as well
        # (2026-09-26, in a venv holding anyio: with -n 2 and the flag no worker loaded it; without the flag
        # both did). Nothing under tests/ is marked
        # anyio or imports the one thing the plugin serves, the SDK's own pytest-marked conformance suite
        # claude_agent_sdk.testing, so the plugin does no work here; and blocked in every pytest process the
        # two checks read where nothing loads it again by its entry-point or module name, a bad anyio pytest
        # plugin cannot fail one at pytest startup before a test runs.
        # Unblocked in a child it did: a synthetic broken anyio/pytest_plugin.py in a CI-shaped venv red tests
        # in each of the six modules whose pytest children lacked the flag, none of which imports the SDK
        # (2026-09-20, before the children gained it). A bad anyio itself, not its plugin, still surfaces
        # where anyio is imported: this step's own `python -c "import claude_agent_sdk"` below, with the
        # import in the traceback, or the SDK-using tests at run time. Measured before the block, the two
        # gated modules on a 3.12 venv with the pinned SDK, single process: 653 passed, 1 skipped, 0 warnings
        # with the plugin (header: timeout, anyio) and the same counts without it (header: timeout). A test
        # that imports the conformance suite lifts the block, and says why.
        # The step refuses an empty, malformed or duplicated constant rather than installing the unpinned
        # latest, and it carries no continue-on-error: the SDK requires cryptography (through mcp's
        # pyjwt[crypto]), so a cryptography wheel lagging an interpreter fails THIS step, and that must be the
        # cell's red, not the gated tests silently skipping. Runs after the cryptography step so pip finds it installed.
        # After pip, the same `python` imports the package: pip and the pytest step below share that name on
        # PATH, so an install that reached another interpreter reds THIS step, with its name on it, instead
        # of a run with the gated tests skipping and a warning as the only trace. The pytest step declares the
        # requirement with ROMP_SDK_REQUIRE=1 (its env below), so the pin test fails on an interpreter that
        # lost the SDK between the two steps.
        # The 3.14t cell installs it too: the wheel is py3-none with Requires-Python >=3.10, its compiled
        # dependencies (cryptography, cffi, pydantic-core, rpds-py) publish cp314t wheels, and on a free-threaded
        # 3.14.6 the install, the import and the gated and host test modules ran green before this landed
        # (2026-09-20). The free-threading evidence is the import with PYTHON_GIL UNSET: in that configuration
        # CPython turns the GIL back on, with a RuntimeWarning, for an extension module that does not declare
        # free-threading support, and the GIL read off after the import, so the four compiled extensions it
        # loads (_cffi_backend, cryptography's _rust, pydantic_core, rpds) declare it. Under the PYTHON_GIL=0 the
        # pytest step runs with, that read cannot fail: the setting forbids the re-enable and silences the
        # warning, so "still off after the import" under it says nothing about the extensions. What the setting
        # buys is that a later wheel without the declaration cannot turn the cell back into a GIL cell; the
        # price is that such a wheel runs without the GIL and without a warning. The SDK's own classifiers
        # stop at 3.13, so a release that breaks there shows as a red cell, which is the point of having the cell.
        # Cost on the Linux cells: about 106.5 MB of download per cell after the cryptography step (the SDK
        # wheel is 102 MB there, 92 MB on the macOS arm64 cells; it bundles the Claude Code binary; its other
        # dependencies total about 4.5 MB) and a few seconds of install; the run's own step timings are the
        # measurement that counts. The step timeout is the file's convention for a download (the bats,
        # gitleaks and Playwright steps): a wedged fetch fails in minutes instead of eating the job's cap.
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^SDK_TESTED_VERSION = "\([^"]*\)".*$/\1/p' kernel/session_host.py)"
          [[ "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "kernel/session_host.py: expected exactly one line SDK_TESTED_VERSION = \"<x.y.z>\", read: '$pin'" >&2
            exit 1
          }
          python -m pip install "claude-agent-sdk==$pin"
          python -c "import claude_agent_sdk"
      - name: Run pytest
        env:
          # This run requires the SDK the step above installed, said as a switch rather than inferred
          # from GITHUB_ACTIONS (a future step that runs pytest without the SDK on purpose, as the
          # served-page step in the served-pages job does, would red for the wrong reason under an
          # inference): tests/test_ci_sdk_pin.py's InstalledVersion FAILS, naming the interpreter, where
          # claude_agent_sdk does not import in the interpreter running pytest, instead of the warning a
          # box's bare road gets, and tests/test_session_host.py's switch case asserts that the host a
          # test spawns imports it. The stance of ROMP_SERVED_TESTS_REQUIRE below. Off (a box), that road
          # warns and the host case skips, saying so. tests/test_ci_sdk_pin.py's population check holds
          # this on every pytest invocation in this file, not on this step's text: each command that runs
          # pytest here sets the switch to exactly 1 in the env Actions merges for it (pytest_invocations'
          # docstring there states the merge; among the forms it reads are an env: key line of the
          # workflow, the job or the step as this file writes them, and a prefix on the command; a quoted
          # value read as written) or is listed there by job and step name with a reason the test checks (the
          # served-page step alone today, whose job installs no SDK), and each passes -p no:anyio with no
          # listing. The check does not run the shell: a step whose run block spells the switch other
          # than as that prefix (among them an unset, an export, an assignment), or whose job's other run blocks
          # spell it (a write to $GITHUB_ENV reaches the steps after), is red until read, and so is any
          # other line here that spells the switch outside an env: key line it reads (among them an aliased
          # or flow env:, a quoted or spaced key, a key-shaped line deeper than its block's keys, a step's
          # shell: or a job's defaults; switch_line_census there states the rule), and a value on an env:
          # key's own line, which may set the switch without spelling it, is refused. Any write of the
          # switch that does not spell its name is outside it, among them one in a run block (env -i, an
          # indirect unset, a loop over the environment), in a shell: or defaults key, by a script or action
          # a step calls, or to $GITHUB_ENV, except on this step, where run_pytest_status refuses those it can
          # see, among them a shell: here or a defaults: on the job or the workflow, a second command or
          # anything before the pytest command (env -i, an unset), a key of this step's merged env outside its
          # env allowlist (BASH_ENV among them), and a run block of this job that spells GITHUB_ENV,
          # GITHUB_PATH or BASH_ENV (run_pytest_status's docstring in tests/test_ci_sdk_pin.py states the rule
          # and its residual); among what stays outside, a write by a script or action a step calls, or one to
          # $GITHUB_ENV or $GITHUB_PATH that does not spell the name. GitHub substitutes a ${{ }} expression
          # into a run block before the shell reads it, so a block whose every expression is the one shape
          # batch 917's evaluator reads (command_on in tests/test_ci_pytest_workers.py: matrix.os compared with
          # one label, choosing between two quoted values, as this step's worker count is) is read once for
          # each label its expressions name and once for every other label, each text substituted as that
          # cell's shell reads it (matrix_os_texts in tests/test_ci_sdk_pin.py), and
          # a step whose run block holds any other expression and spells pytest anywhere in it, in a comment
          # line or a trailing comment too, is red until the value moves to an env: key the block reads as a
          # shell variable (the substituted text can end a comment with a newline and run what follows it);
          # anything that rewrites a pytest command's arguments after that (among them a shell function or
          # alias, a python earlier on PATH, a step's shell:; pytest_invocations' docstring in
          # tests/test_ci_sdk_pin.py states the read) is outside the check, except on this step, where it
          # refuses those it can see, among them a function or alias, which is a second command here, this
          # step's shell: and a defaults: on its job or the workflow, the BASH_ENV key in its merged env or
          # spelled in a run block of this job, and a $GITHUB_PATH write spelled in a run block of this job,
          # which could put another python earlier on PATH (run_pytest_status's docstring states the rule); a
          # write to $GITHUB_PATH that does not spell the name stays outside.
          # The check reads this file's text, in the YAML forms this file uses and no others: every line
          # here is in one of them (YAML_FORMS_ACCEPTED in tests/test_ci_sdk_pin.py, which
          # test_the_forms_the_allowlist_accepts_are_the_forms_ci_yml_uses holds equal to the forms this
          # file uses: block mappings and sequences two columns per level, one-line plain and quoted
          # scalars without escapes, one-line flow sequences of them, a literal block as a step's run,
          # blank lines and comments; on a name: or working-directory: key a non-null plain scalar with no
          # comment, and
          # no value on an env: key's line), or the check refuses it by name, valid YAML included (an
          # anchor, an alias, a folded block, a quoted scalar over two lines, among others): a form the
          # check does not accept is refused by name; reword the step in an accepted form. Every line here that
          # spells pytest, other than the lines its line census excuses (pytest_line_census's docstring in
          # tests/test_ci_sdk_pin.py states the rule), is read as a command or is red until it is read, and so
          # is a job key it does not read; among what it leaves unread (pytest_invocations' docstring in
          # tests/test_ci_sdk_pin.py states the read in full) are a run line that never spells pytest, a pytest
          # run by a script or action a step calls, and the other workflow files. It also holds this step's
          # failure to the cell: this step's exit status is pytest's and the cell's is the step's
          # (run_pytest_status in tests/test_ci_sdk_pin.py; its docstring is the rule). So each of these is red
          # at its line, among others: an if: or a continue-on-error on this step or its job; a key of its job
          # outside its job-key allowlist (a container: among them); the command followed by ||, a pipe or a
          # trailing &; a second command or command line (an earlier trap 'exit 0' EXIT among them); an argument
          # outside its option allowlist (--collect-only, --co and --setup-plan among the refused); a shell:
          # here, or a defaults: on the job or the workflow; a key of this step's merged env outside its env
          # allowlist (PYTEST_ADDOPTS and BASH_ENV among them); and a run block of this job that spells
          # GITHUB_ENV, GITHUB_PATH or BASH_ENV. Outside it, among others (run_pytest_status's docstring states
          # the residual): a write to those files that does not spell their names, such as one by a script or
          # action a step calls; a command that names its interpreter or pytest by a path; and an earlier step
          # whose run block changes the runner without spelling those names, such as one that replaces or
          # shadows the python on PATH, reinstalls pytest, or deletes or edits test files.
          ROMP_SDK_REQUIRE: "1"
          # The cell's shard (2026-10-04): the matrix's shard value on the ubuntu-latest cells, where each interpreter
          # runs as one job per shard, and empty on every other cell, the macOS cells among them, which run every test
          # file. tests/conftest.py reads it, removes it from the environment so no process a test starts inherits it,
          # and skips the test files its rule assigns to the other shards; a value that names no shard is a
          # usage error before collection. tests/test_ci_shards.py holds the value per cell and the shards to a
          # partition of the collected test files.
          ROMP_TESTS_SHARD: ${{ matrix.os == 'ubuntu-latest' && matrix.shard || '' }}
          # The free-threaded cell runs with the GIL off, stated rather than defaulted (a 't'
          # build disables it by default, and an extension that lacks free-threading support
          # would otherwise turn it back on, with a RuntimeWarning in pytest's summary that the
          # cell does not fail on). Empty on every other cell, which CPython reads as unset.
          PYTHON_GIL: ${{ endsWith(matrix.python-version, 't') && '0' || '' }}
        # T230b: a hung test used to be 15 minutes of silence (five jobs since 2026-08-27, a
        # process-global time.sleep patch consumed by a foreign thread). pytest-timeout turns the
        # NEXT stall into a failure that names the test: thread method = guaranteed termination
        # (the process running the test ends) - the signal method cannot interrupt a C call. 600 s
        # strictly exceeds the slowest legitimate test (~122 s, leak-scaled) and the 300 s child
        # timeout in test_session_move_live. Its timer waits on an Event, so it can never itself
        # consume a patched sleep. --durations names the slowest tests on every run so a creeping
        # one is visible before it stalls.
        # One worker on the ubuntu-latest cells, none elsewhere (-n 1 and -n 0, 2026-10-04): the
        # private runner has 2 CPUs and 8 GB, and two workers do not fit it, nor does one worker over the whole
        # suite, so each ubuntu-latest job runs one worker over one shard of the test files (the
        # ROMP_TESTS_SHARD key above; the job's cap comment has the measurement). Measured on 2026-09-22
        # with Python 3.10 at this step's other flags on a four-CPU budget (a systemd CPUQuota of 400
        # percent; GitHub documents its Linux runner for a public repository at 4 CPUs and 16 GB),
        # the suite took 1437 s serially at a cgroup memory peak of 6.0 GB and 739 s with two
        # workers at 10.9 GB (decimal, page cache included), about 5 GB a worker; three workers
        # peaked at 15.8 GB. The Linux cells ran two workers on the public runner from 2026-09-25 to
        # 2026-10-04 (serially they had reached the 25-minute cap they had then: this fork's main,
        # run 35890814789, the 3.14t cell at 24 min 35 s); the two-worker peak is past the private
        # runner's 8 GB, and a local run on 2026-10-04 found one worker's peak past it too (the job's
        # cap comment), which is why the cells are split into shards. One worker (-n 1) rather than an in-process run (-n 0) or no xdist: under
        # the one worker a test the per-test timeout ends fails by name and the other tests run on
        # (below, as under two workers), where in an in-process run, the macOS
        # cells', the timeout's thread method ends the whole run at the hung test; and the worker
        # costs one worker's memory beside the controller's, which collects no tests. The macOS
        # cells stay serial under their 60-minute cap: GitHub documents that runner for a public
        # repository at 3 CPUs and 7 GB (arm64), below the two-worker peak, and two workers have
        # not been measured on it.
        # The count keys on matrix.os, as timeout-minutes does, and names the one label the
        # private runner's shape was sized for, rather than excluding macOS or matching every
        # Linux runner (runner.os), so a runner the matrix adds later runs serially until it is
        # measured.
        # GitHub substitutes the expression into this line before the shell runs it. -n 0 is
        # xdist's in-process run, and pytest refuses -n without xdist, so every cell installs it.
        # The job cap above and its pin in tests/test_ci_bats_bound.py are romp-on/romp PR #2130
        # as merged, but for the Linux figure: the runs before 2026-09-30 they cite are
        # romp-on/romp's Actions runs of its serial suite. The Linux figures are sized for one worker
        # over one shard on the private runner (the job's comment above).
        # Under the Linux cells' worker a timeout ends the worker process running the hung test:
        # xdist fails that test by name ("worker 'gw0' crashed while running '<test id>'") and the
        # other tests run on. The thread dump pytest-timeout writes goes to that worker's stdout,
        # which xdist's transport (execnet) points at /dev/null, so the log names the test but
        # carries no stacks; run the named test alone (without -n) and the dump prints, its bottom
        # frame the blocked primitive.
        # A non-daemon thread still running when the interpreter exits keeps its process from
        # exiting, and so does a concurrent.futures thread of either daemon flag still running a
        # task, since concurrent.futures' exit hooks join every thread in their tables: serially the
        # cell hangs until the thread ends or the job cap cancels it, and under the Linux cells'
        # worker the controller kills a worker still alive when the run ends, so the run would
        # pass. tests/conftest.py's session-end thread guard restores that signal on the Linux
        # cells: at each process's last test it gives each non-daemon thread, and each thread in
        # those tables, up to 10 s to end (it leaves out the main thread, and any thread whose name,
        # target's module or Timer function's module starts with pytest_timeout, which covers the
        # plugin's timer), then fails that test's teardown naming each thread still running, with
        # its stack, and the controller prints that error like any test report
        # (tests/test_session_end_thread_guard.py). That report stays an error naming the threads
        # when pytest's skipping plugin would make it an xfail (an xfail-marked last test) or its
        # unittest plugin would put a TestCase's own second error in its place. The guard also
        # writes the same text to stderr, which a worker shares with the controller. A serial cell
        # prints both, so one that then hangs at exit names the thread in its log. Two kinds of
        # named thread let the process exit and fail the guard all the same: an idle
        # concurrent.futures worker, which the interpreter wakes at exit, and a thread stopped only
        # after the check (a config cleanup, pytest_sessionfinish or pytest_unconfigure).
        # -p no:anyio: the SDK step's closure carries anyio, whose pytest plugin would otherwise
        # auto-load in this process, in the Linux cells' worker (xdist hands it the command's
        # arguments, the flag among them) and in every pytest child the suite spawns in this interpreter
        # (the launchers under tests/ pass the same flag); the SDK step's comment states the decision
        # and its measurement, and tests/test_ci_sdk_pin.py holds the flag on every pytest invocation
        # in this file (its population check) and on the launchers under tests/ its launcher census reads.
        run: python -m pytest -q -n ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }} -p no:anyio --durations=10 --timeout=600 --timeout-method=thread

  shell:
    name: Shell (bats, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A cap for each OS, in the python job's form (its per-OS expression), each the slowest
    # measured or projected job plus 10 minutes, rounded up to a multiple of 5: the 10 minutes
    # exceed the 180 s per-test bound bats is given below plus setup, the margin the python
    # job's rule requires over its own 600 s per-test bound. Linux, 55: the slowest Linux job
    # among the finished runs on main, on the batch branches and on the branches of the open and
    # merged PRs (a run cancelled at a cap has no measured length), read at 03:32 UTC on
    # 2026-10-04, took 40 min 43 s, in run 37128151383 (batch PR #960's pull_request run on
    # 2026-10-03, job 111217616222; its Run bats step 2365 s; it concluded success; that batch
    # landed fork PR 940 on 2026-10-04); 40 min 43 s plus 10 minutes is 50 min 43 s, so 55.
    # macOS, 60: the slowest macOS job among the same runs took 48 min 1 s, in run 37045964763 (a
    # dispatch of fork PR 940's branch on 2026-10-02, job 110967357963; its Run bats step 2856 s;
    # it concluded failure, which still gives a measured length); 48 min 1 s plus 10 minutes is
    # 58 min 1 s, so 60. Fork PR 940, since merged, set this line, at 60 on macOS and 50 on
    # Linux, and installs gitleaks and a newer bash on macOS (the two macOS install steps below),
    # so the credential cases run there; fork PR 926, merging main after 940 landed, set the
    # Linux figure to 55 by this rule. Each job's time is the jobs API's.
    # The vendored tooling tests that ran after Run bats moved to a job of their own
    # (vendored-tooling, below) on 2026-09-28 instead of this cap being raised to hold them.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 60 || 55 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only on a manual run (workflow_dispatch) whose macos input is true, or the weekly schedule, which is
        # paused; see the header note.
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.macos) || github.event_name == 'schedule') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      # bats comes from the pinned release tarball, NOT apt: an Azure apt-mirror outage hung
      # `apt-get update` to the job timeout three runs in a row (2026-08-19, ~35 wasted minutes
      # each). GitHub itself is already on the critical path (checkout), so this adds no new
      # dependency — and no bats test needs a tool the runner image lacks: node, python3 and curl are
      # on the GitHub images (the manager suites run the real bin/romp-manager under node; romp.bats and
      # install-sh.bats run python3 and curl), the rest mock their subjects on PATH; gitleaks, below, is
      # one extra install, for tests/gitleaks-config.bats and the credential cases of
      # tests/pre-push-hook.bats, and on macOS a bash 5.1 or later, below, is the other, for the pre-push
      # hook. The step timeout kills any residual network hang in minutes instead of letting it eat the
      # job's budget.
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 -o /tmp/bats.tar.gz \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.11.1.tar.gz
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-1.11.1/install.sh /usr/local
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install bats-core
      - name: Install bash 5.1 or later (macOS)
        # The pre-push hook's body runs only under bash 5.1 or later: under an older bash, where a scan
        # would run, its gate (bash_gate, at the top of .githooks/pre-push) re-runs the hook under a bash
        # 5.1 or later at /opt/homebrew/bin/bash or /usr/local/bin/bash, and refuses the push when neither
        # holds one (a clone with neither scan armed pushes as before under any bash). The image has only
        # /bin/bash 3.2.57 (the actions/runner-images readme for macos-26-arm64, the image macos-latest
        # names, at 20260907.0351, the version run 36689060323 ran on), so without this step
        # tests/pre-push-hook.bats fails in its setup, which finds no bash 5.1 or later to name, and the
        # other files that run the hook with a scan armed have their pushes refused by the gate. The check
        # below compares the installed version as the gate does, major then minor, so a bottle older than 5.1
        # fails this step rather than the tests. Homebrew links the new bash into /opt/homebrew/bin, which
        # comes before /bin on PATH, so the step then puts a directory holding only a link to /bin/bash first
        # on PATH for the steps after it: bats and the tests still run under bash 3.2.57, the version this
        # cell exists to check, and the hook's gate is what finds the newer bash, at its fixed path. The
        # gate's own cases in tests/pre-push-hook.bats run only under a bash older than 5.1 first on PATH, so
        # this cell is the one CI cell that runs them, and they fail here, rather than skip, if a bash 5.1 or
        # later comes first on PATH.
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          brew install bash
          /opt/homebrew/bin/bash -c '[ "${BASH_VERSINFO[0]}" -gt 5 ] || { [ "${BASH_VERSINFO[0]}" -eq 5 ] && [ "${BASH_VERSINFO[1]}" -ge 1 ]; }'
          mkdir -p "$RUNNER_TEMP/bash-3.2"
          ln -sf /bin/bash "$RUNNER_TEMP/bash-3.2/bash"
          PATH="$RUNNER_TEMP/bash-3.2:$PATH" bash -c '[ "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2 ]'
          echo "$RUNNER_TEMP/bash-3.2" >> "$GITHUB_PATH"
      - name: Install gitleaks (Linux)
        # tests/gitleaks-config.bats skips itself when gitleaks is absent, so without this step the
        # repo's scanning rules (.gitleaks.toml: the value-anchored allowlist, the merge-commit scan)
        # would be checked nowhere; ROMP_GITLEAKS_REQUIRE=1 on the Run bats step below turns that
        # skip into a red job, so a broken install cannot ship as green skips. The same pinned,
        # checksummed release the secrets job installs; bump the four version/sha pairs together (this
        # step's, the macOS step's below, the secrets job's and its copy's in secret-scan.yml; each asset
        # has its own checksum).
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Install gitleaks (macOS)
        # The same pinned release as the Linux step above and the secrets job, as its darwin arm64 asset
        # (macos-latest is macos-26-arm64, and the step fails on another architecture rather than install
        # a binary that cannot run), checked against the release's own gitleaks_8.28.0_checksums.txt with
        # shasum, since the image has no sha256sum. It goes where the Linux step puts it, /usr/local/bin,
        # which is on PATH after the directory the bash step above puts first, so bash 3.2.57 stays the
        # bash first on PATH and `command -v gitleaks` finds this binary (the last line checks it). Without
        # it the credential cases of tests/pre-push-hook.bats skip in this cell, and tests/gitleaks-config.bats
        # fails in its setup under ROMP_GITLEAKS_REQUIRE=1 (the Run bats step below). Before this step and
        # that switch, both files skipped here: 380 skips, "gitleaks not installed", in dispatch
        # 36714942087, 364 in the hook's file and 16 in the config file's.
        if: runner.os == 'macOS'
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: d942f3ad147250c9edbaab3fed9e482f98d3b59ba10ae97b8d75647e3ade492c
        run: |
          set -euo pipefail
          [ "$(uname -m)" = arm64 ]
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_arm64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo mkdir -p /usr/local/bin
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          [ "$(command -v gitleaks)" = /usr/local/bin/gitleaks ]
      - name: Run bats
        # A per-test bound from bats itself (BATS_TEST_TIMEOUT, since bats-core 1.8: a background sleep,
        # then pkill or ps on the test's children), so one hung test fails in minutes and is NAMED in the
        # TAP line ("# timeout after Ns") instead of eating the job's whole budget and being cancelled
        # nameless at the ceiling (the macOS leg, 2026-09-16: every dispatch cut at 35 minutes). No
        # coreutils timeout is involved, which the macOS image lacks. The bound is generous against the
        # slowest legitimate test on macOS (the romp-serve probe tests hold 60 s by design).
        env:
          BATS_TEST_TIMEOUT: "180"
          # ROMP_GITLEAKS_REQUIRE=1 in both cells: each installs the pinned gitleaks in a step above
          # (macOS since 2026-09-30), so tests/gitleaks-config.bats skipping would hide a broken install
          # behind green skips; with the switch its setup() fails and names the reason.
          ROMP_GITLEAKS_REQUIRE: "1"
        run: bats --print-output-on-failure tests/*.bats
      # T224: the manager<->kernel handshake proof (tests/manager-*.test.js: restart coalescing, the
      # quiet-window chain, the drain-lease refusal notices) ran only by hand until now. It runs HERE,
      # inside a check the upstream ruleset already REQUIRES, so a red handshake blocks the merge -
      # a standalone job would have gone red while auto-merge landed the PR anyway (the ruleset lists
      # six contexts and adding one is an owner-side change). node's built-in runner, no deps, no
      # continue-on-error; the runtime is pinned so the step never rides whatever node the image has.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manager handshake tests (node --test)
        run: node --test tests/manager-*.test.js

  secrets:
    # The same job runs as secret-scan.yml's secrets job on each push, of a branch or a tag, whose
    # commit carries that file (its header names the pushes that start no run), since this workflow
    # runs only on a batch push and by hand (2026-09-30; that file's pull_request trigger was dropped
    # on 2026-10-04, and this workflow's weekly schedule is paused).
    # tests/test_ci_secret_scan.py holds the two copies equal, every key but the name, so a change
    # here is made there too; the reasons for the steps are written here only.
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # The job reads the repository and writes nothing.
    permissions:
      contents: read
    # About 2 to 5 minutes in practice, and more as the history grows (a full-history checkout, then
    # two scans; secret-scan.yml's header gives the measured runs); the cap exists so a wedged
    # download cannot burn the 6h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The load-bearing line. A secret's whole problem is that history is permanent, so the
          # scan has to see history: the default depth-1 checkout would scan one commit and report
          # no leaks for a repo with a token three commits back. Depth 0 also brings every branch
          # and tag, which is what the --all below reads.
          fetch-depth: 0
      - name: Install gitleaks
        # Pinned, and checksummed against the publisher's own release manifest
        # (gitleaks_<version>_checksums.txt), rather than the marketplace action: a step that exists
        # to keep secrets out of the repo should not hand a token to a third-party action, and
        # gitleaks-action needs a licence key for organisation-owned repos. To bump, change both
        # lines together, here, in secret-scan.yml's copy of this job and in the shell job's two install
        # steps above (each asset has its own checksum), or the checksum check fails loudly.
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan every commit
        # The repo's rules, named explicitly, as the hook names them: without --config gitleaks
        # reads a GITLEAKS_CONFIG from the environment before the source root, and a missing file
        # would scan under the default rules in silence; named, a missing file fails the step.
        # -v prints the file, line and rule of each hit; without it gitleaks reports a bare count,
        # so a red job would not say what to fix. --redact so a hit does not reprint the secret
        # into a public build log, where it would be MORE exposed than in the commit that tripped
        # the scan. --all reads every branch and tag the checkout brought, not only the pushed
        # ref. --diff-merges=first-parent: `gitleaks git` runs `git log -p`, which omits
        # merge-commit diffs, so a secret introduced only in a merge (a conflict resolution) is
        # invisible to --all alone; the tree scan below catches it only while it is still at HEAD;
        # this surfaces it in history for good. --text: that same `git log -p` reads the checkout's
        # .gitattributes, and a path marked -diff prints a `Binary files ... differ` line with no
        # hunk, so a secret committed in such a path and removed in a later commit is text this scan
        # never sees while the tree scan below reads HEAD, where it is gone; --text prints the diff
        # regardless of the attribute. Latent here today: the one committed .gitattributes
        # (ui/webview/anchor-map-fixtures/.gitattributes) marks a fixture -text, for its line
        # endings, not -diff. Other plain-stream options (--no-color, --no-textconv, --no-ext-diff)
        # guard against a developer's git config; no step of this workflow configures color, textconv
        # or a diff driver (actions/checkout's config writes touch nothing about diff output), so here
        # they would be defence in depth, not load-bearing.
        # The committed attribute is the input this repository carries itself, and --text is its
        # option. A finding exits nonzero and fails the step.
        run: gitleaks git . --no-banner --redact -v --config .gitleaks.toml --log-opts="--all --diff-merges=first-parent --text"
      - name: Scan the tree as it stands
        # The history scan reads commit diffs, so a secret in a file that is present but untouched
        # by any scanned commit (a submodule tip, a file added before a rewrite) is only caught by
        # scanning the tree itself. Runs after a red history scan too, so one run reports both.
        if: ${{ !cancelled() }}
        run: gitleaks dir . --no-banner --redact -v --config .gitleaks.toml

  vendored-tooling:
    name: Vendored tooling (node --test, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The vendored tooling step has a job of its own (since 2026-09-28) because it outgrew the Shell
    # job, where it ran after Run bats. At the fork's main 1d591384e (run 36388144219) the Shell job
    # took 31 min 50 s of its 35-minute cap: Run bats 700 s, then this step 1180 s, where at
    # ffab236bd (run 36308512751) the step took 67 s. The growth is fork PR #780's tracked-changes
    # bash guard: batch 925, the one merge between the two heads, added 27,628 lines under tools/
    # and vendor/track-changents/, about 25,700 of them #780's. node --test runs files side by side
    # but a file's tests one after another, and the tests of one file,
    # tools/romp-track-bash-guard.test.mjs, which run the guard as a process and real bash and dash
    # over tables of shell texts (zsh too where it is installed; the Linux runner has none), add up
    # to about 1100 s in that run's log (the slowest single test 222 s). That file sets the step's
    # length; the other 104 files finish inside it.
    # Raising the Shell cap instead would hide the growth, and with the step inside the Shell job a
    # PR that added more than about three minutes of bats time (the job's margin at 1d591384e was
    # 190 s) ran that job past its cap.
    # The cap here is the expected time and half again. Linux: 1180 s is 19 min 40 s, and half
    # again is about 30 minutes. macOS has never run this step on the fork (it came after Run bats,
    # which was red on every macOS run there). The macOS cells ran the Python suite about twice as
    # long as the Linux cells (the python job's comment above), and macOS has zsh, whose legs the
    # Linux runner skips. On a development box zsh adds about 18 to 29 percent to that file: 1368 s
    # against CI's 1121 s, less 44 s of work only the box does (a history sweep CI's shallow
    # checkout skips, and a slower strace leg), and 1571 s against 1222 s in two matched concurrent
    # runs with and without zsh. So the rule gives about 70 to 76 minutes (twice 19 min 40 s, 18 to
    # 29 percent more, and half again), an estimate that already includes the half again. The
    # macOS cap is 90, 14 minutes past the estimate's upper figure, because two of its inputs are
    # weak: the factor of two comes from the Python suite rather than this step, and about three
    # quarters of that file's time on the box was spent in child processes (the guard run as a node
    # process, bash and dash), whose cost on a macOS runner has not been measured. 90 is past the
    # hour the python job's macOS cap keeps (tests/test_ci_bats_bound.py holds it at 60 or less,
    # since past an hour a hung cell holds the dispatch): the rule's figure for this step, 70 to 76
    # minutes, is already past that hour, so a hung macOS cell here holds a dispatch for up to 90
    # minutes. The first macOS run (a dispatch with its macos input on, while the weekly schedule is
    # paused) measures the step, and the cap is re-read from it. A batch push's run starts the Linux
    # cell alone, so batches are not affected.
    # Follow-ups, in this order: (1) make the hook's per-paren case check linear (skipNested in
    # hooks/romp-track-bash-guard.mjs tests /\bcase\b/ over the whole slice read so far at every
    # `)`: about 210 s of this step on CI, and a stall of about 16 s in the hook itself on a command
    # nested 2000 deep, on a development box); (2) split tools/romp-track-bash-guard.test.mjs so
    # node runs its parts side by side.
    # The manager handshake step stays in the Shell job for T224's reason (upstream's ruleset
    # requires that job's check). This step is the fork's alone (upstream's ci.yml has no such
    # step), and the fork has no ruleset or branch protection: scripts/batch.py land reads the batch
    # push's run of this workflow and refuses a batch whose run is red or has a job with no passing
    # job run, this job among them, so a red here holds a batch as any other red does.
    # Placed between the secrets job and the vscode-extension job: tests/test_ci_sdk_pin.py splices
    # its synthetic Shell-job steps in before the secrets job's key and appends others at the end of
    # the file, where the served-pages job, the job of the served-page step, must stay last.
    # tests/test_ci_vendored_job.py holds this job, its comments aside, equal to a literal (every
    # key, step and field, both caps and the node version), so a change here changes that literal
    # too, on purpose.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 90 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        # macOS only on a manual run (workflow_dispatch) whose macos input is true, or the weekly schedule, which is
        # paused, as in the Shell job; see the header note.
        os: ${{ fromJSON(((github.event_name == 'workflow_dispatch' && inputs.macos) || github.event_name == 'schedule') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      # Node 22, pinned as the Shell job pins it for the handshake step, so the step never rides
      # whatever node the image has.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The node-side tests of the file-comments loop (plans/file-review.md, Slice 1): the vendored
      # track-changents copy's drift test (pin plus patch series, tools/vendor-drift.test.mjs), the
      # behaviour tests for its patches, the file-comments host script, and the vendored guard's own
      # suite (which now spawns the guard as a process). No other step in CI runs these files,
      # tools/pdf-smoke.test.mjs aside, which the vscode-extension job runs again with its dependency
      # installed (it skips here), so this is their only runner.
      - name: Vendored tooling and host-script tests (node --test)
        run: node --test tools/*.test.mjs vendor/track-changents/hooks/*.test.mjs

  vscode-extension:
    name: vscode-extension (typecheck + test + build)
    runs-on: ubuntu-latest
    # Time-boxed like the Python jobs above. Until 2026-09-28 this job also ran the served-page pytest
    # step, which set its length and its cap: 15 minutes, then 25 (main's run 34812968222 took the job
    # 14 min 42 s with that step at 12 min 44 s, and PR 1598's run 34809524051 was cancelled at
    # 15 min 16 s), then 40 (PR 1790's run 35138058863 was cancelled at 25 min 04 s mid served lab on a
    # slow runner, 2026-09-16). At the fork's main 1d591384e (run 36388144219) the job took 36 min 22 s
    # of its 40: that step 1930 s, the steps before it 250 s. The step now has a job of its own
    # (served-pages, below; its comment gives the figures and the reason). Without that step the job
    # took 4 min 45 s on main's run 36555049532 at 6dd80a6e7, the first run on main after the move,
    # and its Browser legs step 2 s, as on main's run 36388144219. The cap was set to 17 minutes on
    # 2026-09-29, sized for a head that rosters the legs open PRs were known to add: fork PR 931's
    # chat leg, about 227 s on a development box (by that PR's review); fork PR 860's gear leg, about
    # 29 s (the step took 31 s on its run 36519655646); and fork PR 862's nine legs, about 24 s (26 s
    # on its run 36456120720). Added one after another, those give a job of about 565 s and a Browser
    # legs step of about 282 s. Node runs roster files side by side on the runner (on 862's run the
    # 41 tests add up to 68.55 s in the step's 26 s), so the sum overstates the legs as timed; it is
    # kept because 931's leg, one file whose tests run in order, was timed on a development box and
    # not on the runner, where it may take longer. A bound of 7 minutes (420 s) is about that step
    # time and half again, the rule the vendored-tooling job sizes its cap by (as the served-pages
    # job did until 2026-10-05), applied here to the step's bound. tools/ci-browser-legs.test.mjs
    # holds the step's bound within the cap less the recorded job time, which counts the step's own
    # seconds as well: 565 s and 420 s make 16 min 25 s, so 17. The job's own time and half again,
    # about 14 min 8 s, is under it too.
    # tests/test_ci_served_job.py holds this job, its comments aside, equal to a literal (every key,
    # step and field, the cap included), so a change here changes that literal too, on purpose. The
    # Browser legs step below carries a bound of its own, 5 minutes (its timeout-minutes), the
    # roster's budget, which fits within the job's margin under this cap at the head the step's own
    # comment names (tools/ci-browser-legs.test.mjs derives the margin from that comment and this cap,
    # so the margin's figures have one home; the cap's sizing above names its own runs), so a step
    # that runs to its bound fails by name and the job still ends under this cap. A roster whose legs
    # together exceed that bound raises the step's timeout-minutes, and this cap too when the new
    # bound does not fit that margin, in the same PR.
    timeout-minutes: 17
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Resolved from the REPO ROOT, not from defaults.run.working-directory.
          # A wrong path here fails the job outright ("Some specified paths were
          # not resolved"), which is what a stale chat-view/ path did until the
          # directory was renamed to vscode-extension/.
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: PDF renderer dependency smoke test (node --test)
        # tools/pdf-smoke.test.mjs opens a synthetic PDF with the pdfjs-dist this job's npm ci installed
        # (plans/file-review.md, Slice 4). The vendored-tooling job's tools/*.test.mjs step picks the file up too,
        # but that job installs nothing, so the test SKIPS there by design and asserts here. Repo root: the
        # test locates node_modules relative to itself.
        working-directory: ${{ github.workspace }}
        run: node --test tools/pdf-smoke.test.mjs
      - name: Build
        run: npm run build
      - name: Cache Playwright's browsers
        # Keyed on the lockfile, so the download below runs once per playwright version.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('vscode-extension/package-lock.json') }}
      - name: Install the pinned Playwright Chromium
        # The pane bench below needs a browser. It is playwright's own download for the version
        # package-lock pins (1.62.x fetches its matching Chromium build, about 150 MB, cached above), NOT
        # the runner image's Google Chrome: the image's browser is unpinned and auto-updated, so a Chrome
        # release the pinned driver cannot speak, or an image without one, would have turned this REQUIRED
        # check red with no change in the repo (review find, 2026-09-08). The same stance as the node pin
        # above: the step never rides whatever the image has. No --with-deps: that runs apt, which the bats
        # step stopped trusting after a mirror outage, and the shared libraries Chromium needs come with
        # the image. tools/ui-bench.mjs prefers this browser to any system Chrome, and the step's log says
        # which one ran ("browser: playwright chromium").
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Browser legs (node --test over ci-browser-legs.txt)
        # The browser legs named in vscode-extension/ci-browser-legs.txt run here with the Chromium installed above.
        # The Test step runs every leg too, but before any browser is installed, so there each one skips at launch,
        # and this step is the job's only run of a rostered leg with a browser. ROMP_BROWSER_LEGS_REQUIRE=1 arms the
        # one shared launcher, inBrowser in ui/webview/real-viewer-leg.ts (any non-empty value counts), and under the
        # switch, inBrowser fails a launch it cannot make, naming the switch and the reason, instead of skipping. So,
        # for a leg that follows the roster rule below, a runner that lost its browser turns this step red rather than
        # green with the coverage gone (the ROMP_UI_BENCH_REQUIRE stance below), and the script prints "the runner
        # lost its browser: check the Chromium install step" beside the failing leg, within the scope the script's
        # header states. The roster is the file each PR
        # adds its legs to, one compiled bundle path per line. The roster rule: under the switch, a rostered leg
        # passes only when inBrowser has launched Chromium, and the leg does nothing that lets it pass otherwise (for
        # example: it launches no browser of its own; nothing catches or settles inBrowser's rejection, so the
        # rejection fails its test; it does not change ROMP_BROWSER_LEGS_REQUIRE, and hands inBrowser no test context
        # but the one node gave it; it does not end its own process, from a test, a hook or a timer; no condition the
        # runner can leave unmet stands between a browser test and its inBrowser call; it skips and marks todo
        # nothing). The reviewer of any PR that adds a roster line or changes a rostered leg's source or inBrowser
        # checks the rule; the step does not. Nothing checks the whole rule for every rostered leg, so the step can
        # read green a rostered leg that breaks it. Examples, not the whole set: a rostered leg that launches its own
        # browser and swallows a failed launch without skipping; a rostered module that launches nothing; a leg that
        # drives a browser from a child process and tolerates the child's failure; a todo test that passes beside a
        # real pass; a leg that catches inBrowser's rejection and passes (a try and catch around the awaited call,
        # .catch(), .then's second argument or Promise's allSettled). A leg built to pass without a browser is outside
        # what the step can detect. tools/ci-browser-legs.test.mjs runs a synthetic leg of each example and reads it
        # green. Nothing checks that every browser leg in the tree is rostered, and main has no such check. inBrowser's
        # read of the switch changes inBrowser's own skip alone: a private skip is not turned into a failure by it, and
        # a private launch that fails is not inBrowser's failure naming the switch. The step sits directly after the
        # Chromium install with nothing before the Test step moved, so plans/markdown-viewer.md's CI sentence and the
        # pin that reads it (tools/markdown-viewer-plan-gate-adopt.test.mjs) stay true. The Dashboard pane bench below
        # runs only after this step passes: a red here skips it for the run, as a red step before it always has (the
        # served-page tests run in a job of their own, served-pages, which a red here does not skip).
        # The script (scripts/ci-browser-legs.sh) checks before node --test that every roster
        # line is a bundle path, listed once, whose source is in the tree and whose bundle is under out-tests/ (the Test
        # step's npm test built it; the Build step writes dist/ only), a red naming the line and the fix; after node
        # --test it reads its own reporter's record (scripts/ci-browser-legs-reporter.mjs) and a rostered leg with no
        # passing test of its own, a skipped test, a failure inside a todo, or a file that failed as a whole is red too,
        # naming the leg or the test, within the scope the script's header states; an empty roster prints "no legs in
        # the roster" and exits 0 without starting node --test, whose default glob would rerun the whole suite
        # (tools/ci-browser-legs.test.mjs, in the vendored-tooling job, runs the script over synthetic trees).
        # Two bounds: this step's timeout-minutes (the job comment above says it fits within the margin under the
        # job's cap at the measured head), so a roster whose legs together exceed it fails this step by name instead of
        # cancelling the job nameless; and node's --test-timeout in the script, a per-FILE bound under the step's, so
        # one hung leg fails by name (node cancels that file and ends its process at the bound, naming it, and runs the
        # other files on; a leg's own { timeout } does not end the process, since a live browser handle keeps it up
        # after the named failure). Nothing reads a leg's cost before it runs: a PR that rosters a leg measures it in
        # the batch push's CI run, or in a workflow_dispatch of the PR's branch (the macOS cells too if its macos input is on), since
        # the PR's own sweep does not run this step (scripts/sweep.py's docstring: it runs only in GitHub's CI, in every
        # run of this workflow: a batch push or a manual run, the weekly schedule being paused), and raises the step's timeout-minutes
        # when the total needs it, and the job's cap with it when the new bound does not fit the margin (the job
        # comment above), and node's --test-timeout when one leg's own bound or its whole-file seconds need it. Step
        # seconds, job minutes and the job's cap:
        # (measured on the runner at 6dd80a6e7, the fork's main after batch 932, in main's run 36555049532, the first run on main after the served-page tests moved to a job of their own, one leg rostered, the launcher's own switch test: 2 s for this step (node's own duration 2.36 s) in a job of 4 min 45 s, under the 17-minute cap, a margin of 735 s. The step's and the job's times are the jobs API's, in whole seconds. A later commit is read against the files this step runs: the roster (vscode-extension/ci-browser-legs.txt), each rostered leg's source (today ui/webview/real-viewer-leg-switch.test.ts alone), the script (scripts/ci-browser-legs.sh), its reporter (scripts/ci-browser-legs-reporter.mjs) and the launcher (ui/webview/real-viewer-leg.ts); one that changes none of them leaves the step as measured (the Playwright version vscode-extension/package-lock.json pins, which fixes the Chromium the install step fetches, and the runner can still move the step's seconds). The step's seconds are read from the batch push's CI run or a workflow_dispatch of the branch, since a PR push does not run this workflow. tools/ci-browser-legs.test.mjs holds the job time here against the cap and the step's own bound, and the cap's figure to the job's timeout-minutes line; of its other figures it checks only that one spelled N s is present, and reads the step's seconds, the stated margin, the sha and the run not at all. The margin is the job's other phases' to spend, so a job that grows toward the cap with the roster unchanged re-measures here and lowers this bound or raises the cap; each PR that adds a leg states its own leg's numbers in its body, read from the batch push's CI run or from a workflow_dispatch of its branch, since a PR push does not run this workflow.)
        # The rostered leg's source named in that parenthesis is the measured head's own: the roster also holds
        # ui/webview/gear-sub-focus-browser.test.ts since fork PR 860 added its line, and that PR's body states the leg's
        # whole-file seconds.
        timeout-minutes: 5
        env:
          ROMP_BROWSER_LEGS_REQUIRE: "1"
        run: bash scripts/ci-browser-legs.sh
      - name: Dashboard pane bench (node --test)
        # tools/ui-bench.mjs replays a synthetic frame stream into the real feed and timeline pages in the
        # headless Chromium installed above, served by the kernel's own page route from the dist the Build
        # step just wrote; python3 comes with the image (every Ubuntu image ships one inside the kernel's
        # 3.10 to 3.13 range, which the Python cells above cover). The test file lives at the repo root,
        # hence the working-directory override of the job's vscode-extension/ default. On a contributor's
        # machine the browser tests skip, and say why, when no browser, python3 or dist is present. Here
        # ROMP_UI_BENCH_REQUIRE makes that skip a failure: this is the only CI run of the real pane
        # bundles, and a runner without the browser or python3 must turn the job red rather than green
        # with the coverage gone (the same stance as the cryptography install above, which exists so its
        # tests RUN). The replays assert only what holds under any scheduling (totals, ordering, the
        # handoff's accounting); the timing relations are assertions only under ROMP_UI_BENCH_TIMING,
        # which this step deliberately leaves unset: a shared runner's scheduler is not what the required
        # check measures (review find, 2026-09-08).
        working-directory: ${{ github.workspace }}
        env:
          ROMP_UI_BENCH_REQUIRE: "1"
        run: node --test tests/ui-bench.test.mjs

  served-pages:
    name: Served pages (pytest, ubuntu-latest)
    runs-on: ubuntu-latest
    # The served-page tests have a job of their own (since 2026-09-28) because they outgrew the
    # vscode-extension job, where they ran last. At the fork's main 1d591384e (run 36388144219) that
    # job took 36 min 22 s of its 40-minute cap, 1930 s of it this step, and fork PRs 821, 857 and
    # 860 each add served labs (about 205 s, 90 s and 34 s). 860's figure is the own times of the
    # three kernel-backed tests it adds to the step, on a development box in CI's configuration, by
    # that PR's review: the two-host lab about 20 s, the held-pair module 5.43 s and the redial lab
    # 8.86 s (the rest it adds there is kernel-free tests and a change to an existing lab); its
    # served step took 32 min 21 s on its run 36519655646 at bb1f4a927, 11 s over main's 32 min 10 s
    # in the run above. 821 with 857 in one batch would have run that job about 77 s past its cap,
    # and 821 with 860 about 21 s past it by 860's figure above (2 s under it by the whole step's),
    # while 857 with 860 would have left it 94 s. Raising that cap was declined, since it would hide
    # the growth.
    # In a job of its own the step is held to a cap sized for it alone, it runs beside the
    # vscode-extension job instead of after that job's steps, and a red step there no longer skips it.
    # The job repeats the setup the step needs and nothing else: the checkout, node with its npm
    # cache, npm ci (the labs drive Chromium through the extension's playwright and build their
    # bundles with its esbuild), the Playwright browser cache and the pinned Chromium, and Python.
    # It has no Build step: the labs build the bundles themselves through tests/lab_dist.py
    # (node esbuild.js, one build under a lock, then a copy per lab), which builds whenever its
    # marker is absent, as it is after an npm run build, so the first lab built that step's dist
    # again. On main's run the repeated steps took about 16 s: the checkout 6 s, node 1 s, npm ci
    # 3 s, the cache 3 s, Chromium 1 s, and the job's own set-up and post steps.
    # The cap is the slowest measured job plus 10 minutes, rounded up to a multiple of 5, the rule
    # the Shell job's cap comment states. Read at 11:47 UTC on 2026-10-05, this workflow's runs
    # since this job's first, on 2026-09-28, hold 246 completed jobs of this name, cancelled ones
    # among them. The jobs API lists 255 records of this name when every run attempt is listed
    # (filter=all): re-running a run's failed jobs lists the run's already-finished job of this
    # name again in the later attempt, with the same times and runner, and nine of the 255 are
    # such copies. Listing only each run's latest attempt, the API's default, gives 242. The slowest
    # with a measured length (a job cancelled at a cap has none) took 49 min 11 s, in run
    # 37212676524 (batch PR 970's checks, batch/2026-10-04b; it concluded failure, which still
    # gives a measured length). The same PR's checks at two later heads took 47 min 35 s (run
    # 37252801761) and 48 min 8 s (run 37265609611). All three ran on the public runner; each
    # job's time is the jobs API's. 49 min 11 s plus 10 minutes is 59 min 11 s, so 60.
    # Two of the 246 were cancelled at the 50-minute cap, so they ran longer by an amount not
    # measured (neither cancelled job has a log): job 110492093901 of run 36898691471
    # (2026-10-01), and job 111708325878, the first attempt of run 37293073638 (fork PR 978's
    # checks, 2026-10-05). That run's second attempt re-ran the job, which succeeded in 40 min
    # 12 s, so the run concluded success and its default job listing shows only that job.
    # Here the 10 minutes are the step's own 600 s per-test timeout, so the margin past it is the
    # rounding alone. The step's other rule (the python job's), the phase plus the 600 s per-test
    # timeout plus the time before the step, gives 3548 s for run 37212676524 (its step's 2926 s,
    # the 600 s and the 22 s before the step), about 59 min 8 s, 52 s under 60: a run whose tests
    # take more than 52 s longer than that one's, its last test stalled, reaches this cap before
    # the per-test timeout fires. The header's sentence on the first private batch run names this
    # job for that run to confirm. Until 2026-10-05 the cap was 50, the expected time and half
    # again: the step's 1930 s and about 16 s of setup in main's run above were about 32 min 30 s,
    # and half again about 49 minutes; 50 then also covered the phase plus the 600 s per-test
    # timeout plus setup (about 42 min 30 s) and the three PRs above together (about 329 s more, a
    # job of about 37 min 55 s).
    # No strategy key: the job has no matrix, so fail-fast would have no effect (it cancels a
    # matrix's other cells when one fails, and this job has one cell).
    # Last in the file: tests/test_ci_sdk_pin.py appends synthetic steps at the end of the file and
    # reads them as this job's, the served step's. The fork has no ruleset or branch protection:
    # scripts/batch.py land reads the batch push's run of this workflow and refuses a batch whose
    # run is red or has a job with no passing job run, this job among them, so a red here holds a
    # batch as any other red does.
    # tests/test_ci_served_job.py holds this job, its comments aside, equal to a literal (every key,
    # step and field, the cap included), so a change here changes that literal too, on purpose.
    # It also holds the cap at or above the rule's figure for the slowest measured job it records
    # (SLOWEST_SERVED_JOB_S), and holds the rule's sentence above (the job's time, plus 10 minutes,
    # the sum, and the cap) to that job's time and to this line, so a lower cap, or a newly
    # measured slowest job, changes that module too.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Resolved from the REPO ROOT, not from defaults.run.working-directory, as in the
          # vscode-extension job.
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Cache Playwright's browsers
        # Keyed on the lockfile, as in the vscode-extension job, so the two jobs restore one entry.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('vscode-extension/package-lock.json') }}
      - name: Install the pinned Playwright Chromium
        # The labs' browser: playwright's own download for the version package-lock pins, as in the
        # vscode-extension job, whose install step says why it is not the image's Chrome and why the
        # step has no --with-deps.
        timeout-minutes: 5
        run: npx playwright install chromium
      - uses: actions/setup-python@v5
        # For the served-page tests below: the image's python3 would do, but its pip refuses to install
        # into the system interpreter, and pytest is not on the image.
        with:
          python-version: '3.12'
      - name: Browser-backed served-page tests (pytest)
        # tests/test_*_browser.py and tests/test_*_served.py boot a hermetic kernel and drive the real
        # dashboard pages in the headless Chromium installed above; on the Python matrix runners (no
        # node deps, no browser) they skip, and say why, so a served-page regression never turned CI
        # red (the deep-link landing pin, 2026-09-10: red on main, CI green). This job installs what
        # they need (the extension's node deps and Playwright's Chromium; the labs build the bundles
        # themselves, once, and each serves its own copy; see the job's comment), so they run HERE, one pytest process, with
        # ROMP_SERVED_TESTS_REQUIRE=1 turning any skip in those files into a failure that carries the
        # skip's reason (tests/conftest.py; the same stance as ROMP_UI_BENCH_REQUIRE in the
        # vscode-extension job above): a runner without the browser, the deps or a serving kernel
        # turns the job red rather than green with the coverage gone. cryptography is what the push
        # tests' kernel needs, as in the Python jobs.
        # ROMP_SERVED_TESTS_ENGINES names the one engine this job installs: the pane-hiding test drives
        # Chromium, Firefox and WebKit, and its legs for engines a runner declares it does not have skip
        # as "optional", which the switch leaves alone (WebKit's system libraries would need apt, which
        # this step does not run; see the install step above). The matrix jobs are unchanged: still no
        # browser, still skipping these. --durations=20 names the slowest labs in the log: this step is
        # the job's one long phase (2926 s of the job's 49 min 11 s in run 37212676524, the run the cap above is
        # sized from; it took 1930 s in run 36388144219, before it had a job of its own),
        # and every served lab added grows it, so the next growth should be visible by name. Two additions on 2026-09-20
        # (the maintainer's round 1 of the wsBytesByHost review), both pinned by tests/test_served_labs_under_ci.py: the pytest line
        # names tests/test_relay_dial_declares_held_pair.py by file, a raw-socket kernel leg that needs the dist
        # tests/lab_dist.py builds and no browser, so no glob names it and it ran in no job (its filename is plain on
        # purpose, so the conftest's REQUIRE rule does not read it; the module itself turns its precondition
        # skips, no built dist or a kernel that never served, into failures under the switch, and its gen-key
        # skip alone stays a skip here); and ROMP_CORNER_TWO_HOSTS
        # runs the two-host lab (TwoHostsBytesByHost in the corners module: three kernels and Chromium),
        # whose knob keeps every other runner unchanged.
        # -p no:anyio, as on every pytest invocation in this file (tests/test_ci_sdk_pin.py's population
        # check holds the flag on each, with no exemption): this interpreter has no anyio today (the pip
        # line below installs pip, pytest, pytest-timeout and cryptography, none of which depends on it;
        # run 35535192879's served step installed nine packages, none anyio) and pytest accepts the flag
        # where the plugin is absent, so the flag costs nothing here and a package added to that line
        # whose closure carries anyio cannot auto-load its pytest plugin without a word. No
        # ROMP_SDK_REQUIRE: the switch declares that the interpreter running pytest has the SDK the Python
        # job's install step put there, and this job installs none, so setting it would declare something
        # untrue; the population check lists this step for the switch with that reason and checks its
        # premises (no SDK install in this job's run blocks; none of the files the pytest line names, and no
        # helper module under tests/ they could import, conftest included, spells the switch's name), so the day a
        # served module spells the switch's name the listing goes red (keyed on the spelling in the file's
        # text: a reader that spells the name indirectly is outside that read).
        working-directory: ${{ github.workspace }}
        env:
          ROMP_SERVED_TESTS_REQUIRE: "1"
          ROMP_SERVED_TESTS_ENGINES: chromium
          ROMP_CORNER_TWO_HOSTS: "1"
        run: |
          python -m pip install --upgrade pip pytest pytest-timeout cryptography
          python -m pytest tests/test_*_browser.py tests/test_*_served.py tests/test_relay_dial_declares_held_pair.py -q -rs -p no:cacheprovider -p no:anyio --durations=20 --timeout=600 --timeout-method=thread
