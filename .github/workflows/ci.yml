name: CI

# Run the test suites that gate romp: the Python pipeline (kernel/, cli/,
# postal/), the shell surfaces (tmux hooks / postal / manager), and the VS Code
# extension build.
#
# LINUX runs on every push and PR — it is free on a public repo, no minute cap.
# macOS is BILLED even on a public repo (larger runners always are, at ~10x), and
# the bats suite alone is ~16 macOS-minutes = ~160 billable minutes per run, so
# it does NOT run automatically. Trigger it by hand from the Actions tab ("Run
# workflow") when you want a cross-platform check before a release or after
# touching a platform-sensitive surface (tmux, launchd, the folder opener).
# On a macOS dev box, the pre-push hook runs the same suites locally, so the
# common macOS-only breakages (a real browser opening, a tmux-binary dependency)
# are caught before the push rather than waiting on this manual run.
#
# Python spans 3.10 (the floor docs/install.md promises) through 3.13 (the dev
# version); the older versions run on Linux only, since a version gap and a
# platform gap rarely fail the same way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the manual on-switch for the macOS cells (see above)

# A newer push to the same ref cancels the older in-flight run OF THE SAME KIND.
# The event is part of the key on purpose: a release dispatch (the macOS gate)
# shares main's ref with every push, and a bare ref key let an auto-merged PR
# cancel the in-flight release run mid-watch (2026-07-27).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every job is time-boxed. Without this a test that BLOCKS (waiting on a tmux
    # server, a socket, a prompt that never comes) burns the 6h default before
    # anyone finds out, and a required check that hangs blocks merges silently.
    timeout-minutes: 15
    strategy:
      # One red cell must not hide the others: a 3.10-only break and a
      # macOS-only break look identical if the matrix stops at the first.
      fail-fast: false
      matrix:
        # macOS is in the matrix ONLY on a manual run (workflow_dispatch); a
        # normal push/PR gets Linux alone. See the billing note in the header.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python-version: ['3.10', '3.13']
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        # cryptography: the kernel's Web Push soft dependency (plans/ios-app.md). Installed here
        # so tests/test_kernel_webpush.py's crypto layers RUN in CI instead of skipping — the
        # kernel itself still degrades loudly without it (that path has its own test).
        run: python -m pip install --upgrade pip pytest cryptography
      - name: Run pytest
        run: python -m pytest -q

  shell:
    name: Shell (bats, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Generous vs the python jobs on purpose: the suite takes ~1min on Linux but
    # ~16min on macOS, so anything near 15 would kill a PASSING job.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # macOS only on a manual run (workflow_dispatch); see the header note.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      # bats comes from the pinned release tarball, NOT apt: an Azure apt-mirror outage hung
      # `apt-get update` to the job timeout three runs in a row (2026-08-19, ~35 wasted minutes
      # each). GitHub itself is already on the critical path (checkout), so this adds no new
      # dependency — and no bats test needs a real tmux (every suite PATH-prepends its own mock),
      # so nothing else is installed at all. The step timeout kills any residual network hang in
      # minutes instead of letting it eat the job's budget.
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 -o /tmp/bats.tar.gz \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.11.1.tar.gz
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-1.11.1/install.sh /usr/local
      - name: Install bats + tmux (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install bats-core tmux
      - name: Install gitleaks (Linux)
        # tests/gitleaks-config.bats self-SKIPS when gitleaks is absent, so without this the
        # config's own rules (the value-not-path allowlist, the merge-commit scan) are validated
        # nowhere and a config regression ships green. Same pinned+checksummed binary as the
        # secrets job — keep the two version/sha pairs in step. Linux only; the macOS shell cell is
        # workflow_dispatch-only, and Linux is the arbiter for the config tests.
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
      - name: Run bats
        run: bats --print-output-on-failure tests/*.bats

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # Seconds in practice — the cap only exists so a wedged download cannot burn
    # the 6h default while a required check sits pending.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # THE load-bearing line. A secret's whole problem is that history is
          # permanent, so the scan has to see history: the default depth-1
          # checkout would scan one commit and report "no leaks found" for a repo
          # with a token three commits back.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          # Pinned, and checksummed against the publisher's own manifest
          # (gitleaks_<v>_checksums.txt). Installing the binary rather than the
          # marketplace action keeps a secret-scanning step from depending on a
          # third-party action that gets a token, and on a licence key that
          # gitleaks-action requires for organisation-owned repos.
          # To bump: change both lines together, or the checksum check fails loudly.
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
      - name: Scan every commit
        # -v prints the file, line and rule of each hit; without it gitleaks
        # reports a bare count, so a red job would not say what to fix.
        # --redact so a hit does not reprint the secret into a public build log,
        # where it would be MORE exposed than in the commit that tripped the
        # scan. .gitleaks.toml is picked up from the repo root.
        # --diff-merges=first-parent: `gitleaks git` runs `git log -p`, which omits
        # merge-commit diffs, so a secret introduced only in a merge (a conflict
        # resolution) is invisible to --all too. The tree scan below catches it
        # only while it is still at HEAD; this surfaces it in history permanently.
        run: gitleaks git . --no-banner --redact -v --exit-code 1 --log-opts="--all --diff-merges=first-parent"
      - name: Scan the tree as it stands
        # The history scan reads commit diffs, so a secret in a file that is
        # present but untouched by any scanned commit (a submodule tip, a file
        # added before a rewrite) is only caught by scanning the tree itself.
        if: always()   # both scans report on a bad push, not just the first to fail
        run: gitleaks dir . --no-banner --redact -v --exit-code 1

  vscode-extension:
    name: vscode-extension (typecheck + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Resolved from the REPO ROOT, not from defaults.run.working-directory.
          # A wrong path here fails the job outright ("Some specified paths were
          # not resolved"), which is what a stale chat-view/ path did until the
          # directory was renamed to vscode-extension/.
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
