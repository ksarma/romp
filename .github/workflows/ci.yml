name: CI

# Run the test suites that gate romp: the Python pipeline (kernel/, cli/,
# postal/), the shell surfaces (hooks / postal / manager), and the VS Code
# extension build; and scan the whole history for credentials (the secrets job).
#
# LINUX runs on every push and PR — it is free on a public repo, no minute cap.
# macOS is free too on the standard macOS runners of a public repository (2026-09-17;
# an earlier note here said it was billed), but the macOS cells are slow (the bats
# suite alone is about 16 minutes) and the runners are scarcer, so they do NOT run
# on every push. They run once a week on a schedule (see `on:`) and
# by hand from the Actions tab ("Run workflow") when you want a cross-platform
# check before a release or after touching a platform-sensitive surface (launchd,
# the folder opener, the CLI scope).
# On a macOS dev box, the pre-push hook runs the same suites locally, so the
# common macOS-only breakages (a real browser opening, a GNU-only flag)
# are caught before the push rather than waiting on this manual run.
#
# Python spans 3.10 (the floor docs/install.md promises) through 3.13 (the dev
# version), plus free-threaded 3.14t with the GIL off (the kernel's builders, judge
# tiers and handlers are threads, and only there do they run at once); the older
# versions and the free-threaded cell run on Linux only, since a version gap and
# a platform gap rarely fail the same way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # the manual on-switch for the macOS cells (see above)
  schedule:
    # The macOS cells also run ONCE A WEEK on their own (2026-09-16): with the manual switch alone the
    # release gate was the first macOS run in two weeks, and it found twenty-nine failures that had
    # accumulated unseen. One run at a quiet hour Pacific (Monday 10:00 UTC is 03:00 Pacific in summer,
    # 02:00 in winter); the manual dispatch stays for the release day and for a platform-sensitive change.
    - cron: "0 10 * * 1"   # weekly macOS cells: the scheduled run selects the same matrix a manual dispatch does

# A newer push to a PULL REQUEST cancels the older in-flight run of the same
# kind: the new head supersedes the old one, and the old verdict is moot. The
# event is part of the key on purpose: a release dispatch (the macOS gate)
# shares main's ref with every push, and a bare ref key let an auto-merged PR
# cancel the in-flight release run mid-watch (2026-07-27).
# Pushes to main are keyed on the commit sha and never cancelled: main's CI
# must never cancel itself. With one group per ref, two merges in quick
# succession cancelled the first merge's run, and a red main (2e9d4492,
# 2026-09-08) went unseen until a later run happened to fail; a queue would
# not do either, since a group holds at most one pending run and a third merge
# would replace the second's. One group per merge commit, so every merge gets
# its own completed run. A dispatch queues rather than cancels for the same
# reason: a release gate mid-watch is not superseded by a second dispatch.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Every job is time-boxed. Without this a test that BLOCKS (waiting on a socket,
    # a prompt that never comes) burns the 6h default before
    # anyone finds out, and a required check that hangs blocks merges silently.
    # T230b follow-up (the review's catch): the job cap must EXCEED the pytest phase plus the
    # 600 s per-test timeout plus setup, or a stall that begins late in the run is killed by
    # this cap first - the identical silence the per-test timeout exists to end. Measured from the
    # Actions API (2026-09-20): the five Linux cells' pytest phases ran 866 to 1184 s on the run this
    # branch was cut from (main's run 35503189425) and 849 to 1175 s across the four main runs before it
    # (35465249059 through 35489584489), and on main's run 35513531701 the Linux jobs took 16 min 29 s
    # (3.13) to 19 min 56 s (3.14t) whole, 5.1 to 8.5 minutes under the 25 min cap on that run; on this
    # branch's first CI run (run 35516364698) the SDK step below took 5.5 to 7.7 s per cell (step start
    # to pip's Successfully installed line) and the jobs 17 min 20 s to 20 min 56 s whole. The rest of
    # the worst cell's extra minute is the tests that moved from skipping to running (624 skipped on
    # main's run to 574 on the branch's), about 45 s serially on a box, on top of the runners' own
    # per-cell spread, which in main's pytest step alone is 147 to 235 s per cell over its eleven runs
    # through 35518469298. An earlier version of this
    # comment priced the phases at 160 to 300 s (25 min = 300 + 600 + setup). That pricing was wrong;
    # the cap stands. At the measured phases the invariant above would need about 30 min, but the
    # worst cell finishes 4 to 5 minutes under 25, this fork's binding constraint is the runner queue,
    # and a higher cap holds a runner that much longer on every stuck cell; a genuine slowdown is
    # caught here first, and a stall that begins after minute 15 of the worst cell, its last five
    # minutes or so, is ended by this cap, named by the job's timeout rather than the test's. The
    # macOS cells (a manual dispatch) run the same suite in
    # 17 to 25 minutes on the image's slower runners: the 3.10 cell took 24 min 43 s on one dispatch
    # and was cancelled at 25 min 27 s on the next (2026-09-16), a one-minute margin that can kill the
    # release's combined proof for nothing. macOS gets 40; Linux keeps 25.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 40 || 25 }}
    strategy:
      # One red cell must not hide the others: a 3.10-only break and a
      # macOS-only break look identical if the matrix stops at the first.
      fail-fast: false
      matrix:
        # macOS is in the matrix ONLY on a manual run (workflow_dispatch) or the weekly
        # schedule; a normal push/PR gets Linux alone. See the billing note in the header.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        python-version: ['3.10', '3.13']
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.14t'   # setup-python's spelling for the free-threaded build (see the header)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest pytest-timeout
      - name: Install cryptography
        # cryptography: the kernel's Web Push soft dependency (plans/ios-app.md). Installed here
        # so tests/test_kernel_webpush.py's crypto layers RUN in CI instead of skipping — the
        # kernel itself still degrades loudly without it (that path has its own test). It ships
        # free-threaded (cp314t) wheels since 46.0, so the 3.14t cell installs it like the rest.
        # The 3.14t allowance below no longer keeps that cell green without it (2026-09-20): the
        # SDK step next requires cryptography through mcp's pyjwt[crypto] and carries no allowance,
        # so a cryptography wheel lagging the interpreter reds the cell there. What the allowance
        # still does is let the failure be named by this step first, where the package is.
        continue-on-error: ${{ endsWith(matrix.python-version, 't') }}
        run: python -m pip install cryptography
      - name: Install the Claude Agent SDK
        # The SDK behind the hosted-session backend, installed at the version the session host is written
        # against: SDK_TESTED_VERSION in kernel/session_host.py, the repo's ONE declaration of it, read here
        # with the sed bin/romp-sdk-setup runs over the same line. With it installed, the 48 SDK-gated tests
        # (43 in tests/test_sdk_backend.py, 5 in tests/test_host_transport.py) and the two SDK-transport host
        # tests in tests/test_session_host.py RUN in CI instead of skipping, and every session host a test
        # spawns takes the SDK transport, as it does on a box with the venv bin/romp-sdk-setup builds (one
        # control in tests/test_session_host.py hides the SDK from its host and keeps the pipe transport tested).
        # Why that version and not PyPI's latest: it is the one the full suite passed under on the box that
        # runs the hosted sessions (16875 passed, 566 skipped, 1 xfailed, 0 failed), and the newer release that existed
        # when this landed (0.2.157, the fifth release in four days) was left alone on purpose: the version is
        # chosen by a run of the host tests, not by the package index. Bumping it is the act the constant's
        # comment describes: install the new version, run the host tests on it, move the number, and the
        # installer, the host's own version check and this step follow the line. The residual is that nothing
        # polls PyPI: a person notices a release, and a break in a newer SDK shows up only when someone moves
        # the constant. A second residual, of the interpreter having the SDK: on the 3.10 to 3.13 cells (and
        # the two macOS cells; not 3.14t, which defers annotations) tests/test_session_host.py run ALONE fails
        # 8 SpawnSecrets tests, its Popen patch live when the module first imports the SDK and mcp's win32
        # utilities evaluate subprocess.Popen[bytes] at class definition; the one pytest invocation below
        # collects an SDK-importing module first and is green. Pre-existing on any such interpreter; the
        # class's docstring has the detail; a follow-up.
        # The constant pins the SDK alone. Its dependency closure resolves fresh on every run (26 packages on
        # 2026-09-20: the 3.12 cell's pip line on run 35518107329 lists 27 names with the SDK, anyio among
        # them), so a red that no commit explains is a transitive release, and the pin test below does not
        # catch one: it compares the SDK's own version and nothing else. One of those packages, anyio,
        # registers a pytest plugin (a pytest11 entry point) that pytest would auto-load in every cell across
        # the whole suite; the pytest step passes -p no:anyio so it does not (2026-09-20). Blocked because:
        # the box's default pytest run never loads it (romp's SDK lives in the venv bin/romp-sdk-setup builds,
        # whose site joins sys.path at tests/test_host_transport.py's import, after plugin autoload, and the
        # box venvs carry no anyio; the one box road that would load it, tests/README.md's PYTHONPATH recipe,
        # which puts that site on the path before pytest starts, passes the same flag), so no pytest process
        # the two checks below read loads a plugin the box's default run does not: the flag is on both of this
        # file's pytest lines and on every pytest the suite starts in the cell's interpreter in a form the
        # launcher census reads (tests/test_ci_sdk_pin.py holds both populations, this file's by its population
        # check and the suite's by its launcher census, which reads argv literals under tests/, the positional
        # arguments of asyncio.create_subprocess_exec and of the os.exec and os.spawn l forms, and an in-process
        # pytest.main, pytest.console_main or _pytest.config.main by name, alias or import: a pytest command in
        # a constant string or f-string written at the call and handed to subprocess, os.system or os.popen,
        # asyncio.create_subprocess_shell, shlex.split or a shell's -c is red until spelled as an argv; a string
        # anywhere else, or one held in a variable or built with %, + or .format, is outside the read, as is an
        # argv assembled one element at a time and an in-process pytest reached through getattr, importlib or
        # runpy). The two plugin sets are not equal, and this comment does not say they are: the box's
        # default run loads pytest-xdist's two plugins, which no cell installs. Nothing under tests/ is marked
        # anyio or imports the one thing the plugin serves, the SDK's own pytest-marked conformance suite
        # claude_agent_sdk.testing, so the plugin does no work here; and blocked in every pytest process the
        # two checks read, a bad anyio pytest plugin cannot fail one at pytest startup before a test runs.
        # Unblocked in a child it did: a synthetic broken anyio/pytest_plugin.py in a CI-shaped venv red tests
        # in each of the six modules whose pytest children lacked the flag, none of which imports the SDK
        # (2026-09-20, before the children gained it). A bad anyio itself, not its plugin, still surfaces
        # where anyio is imported: this step's own `python -c "import claude_agent_sdk"` below, with the
        # import in the traceback, or the SDK-using tests at run time. Measured before the block, the two
        # gated modules on a 3.12 venv with the pinned SDK, single process: 653 passed, 1 skipped, 0 warnings
        # with the plugin (header: timeout, anyio) and the same counts without it (header: timeout). A test
        # that imports the conformance suite lifts the block, and says why.
        # The step refuses an empty, malformed or duplicated constant rather than installing the unpinned
        # latest, and it carries no continue-on-error: the SDK requires cryptography (through mcp's
        # pyjwt[crypto]), so a cryptography wheel lagging an interpreter fails THIS step, and that must be the
        # cell's red, not 48 tests silently skipping. Runs after the cryptography step so pip finds it installed.
        # After pip, the same `python` imports the package: pip and the pytest step below share that name on
        # PATH, so an install that reached another interpreter reds THIS step, with its name on it, instead
        # of a run with the 48 tests skipping and a warning as the only trace. The pytest step declares the
        # requirement with ROMP_SDK_REQUIRE=1 (its env below), so the pin test fails on an interpreter that
        # lost the SDK between the two steps.
        # The 3.14t cell installs it too: the wheel is py3-none with Requires-Python >=3.10, its compiled
        # dependencies (cryptography, cffi, pydantic-core, rpds-py) publish cp314t wheels, and on a free-threaded
        # 3.14.6 the install, the import and the gated and host test modules ran green before this landed
        # (2026-09-20). The free-threading evidence is the import with PYTHON_GIL UNSET: in that configuration
        # CPython turns the GIL back on, with a RuntimeWarning, for an extension module that does not declare
        # free-threading support, and the GIL read off after the import, so the four compiled extensions it
        # loads (_cffi_backend, cryptography's _rust, pydantic_core, rpds) declare it. Under the PYTHON_GIL=0 the
        # pytest step runs with, that read cannot fail: the setting forbids the re-enable and silences the
        # warning, so "still off after the import" under it says nothing about the extensions. What the setting
        # buys is that a later wheel without the declaration cannot turn the cell back into a GIL cell; the
        # price is that such a wheel runs without the GIL and without a warning. The SDK's own classifiers
        # stop at 3.13, so a release that breaks there shows as a red cell, which is the point of having the cell.
        # Cost on the Linux cells: about 106.5 MB of download per cell after the cryptography step (the SDK
        # wheel is 102 MB there, 92 MB on the macOS arm64 cells; it bundles the Claude Code binary; its other
        # dependencies total about 4.5 MB) and a few seconds of install; the run's own step timings are the
        # measurement that counts. The step timeout is the file's convention for a download (the bats,
        # gitleaks and Playwright steps): a wedged fetch fails in minutes instead of eating the job's cap.
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^SDK_TESTED_VERSION = "\([^"]*\)".*$/\1/p' kernel/session_host.py)"
          [[ "$pin" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "kernel/session_host.py: expected exactly one line SDK_TESTED_VERSION = \"<x.y.z>\", read: '$pin'" >&2
            exit 1
          }
          python -m pip install "claude-agent-sdk==$pin"
          python -c "import claude_agent_sdk"
      - name: Run pytest
        env:
          # This run requires the SDK the step above installed, said as a switch rather than inferred
          # from GITHUB_ACTIONS (a future step that runs pytest without the SDK on purpose, as the
          # served-page step in the extension job does, would red for the wrong reason under an
          # inference): tests/test_ci_sdk_pin.py's InstalledVersion FAILS, naming the interpreter, where
          # claude_agent_sdk does not import in the interpreter running pytest, instead of the warning a
          # box's bare road gets, and tests/test_session_host.py's switch case asserts that the host a
          # test spawns imports it. The stance of ROMP_SERVED_TESTS_REQUIRE below. Off (a box), that road
          # warns and the host case skips, saying so. tests/test_ci_sdk_pin.py's population check holds
          # this on every pytest invocation in this file, not on this step's text: each command that runs
          # pytest here sets the switch to exactly 1 in the env Actions merges for it (workflow, job, step,
          # or a prefix on the command; a quoted value read as written) or is listed there by job and step
          # name with a reason the test checks (the served-page step alone today, whose job installs no
          # SDK), and each passes -p no:anyio with no listing. The check does not run the shell: a step
          # whose run block spells the switch other than as that prefix (an unset, an export, an
          # assignment), or whose job's other run blocks spell it (a write to $GITHUB_ENV reaches the
          # steps after), is red until read; a write by a script or action a step calls, or one to
          # $GITHUB_ENV that does not spell the name, is outside it. The check reads this file's text:
          # every line here that spells pytest, outside a comment or a name: key and other than a pip
          # install, is read as a command or is red until it is read, whatever its layout (its line
          # census), and so is a job key it does not read; a run line that never spells pytest, a pytest
          # run by a script or action a step calls, and the other workflow files are outside it.
          ROMP_SDK_REQUIRE: "1"
          # The free-threaded cell runs with the GIL off, stated rather than defaulted (a 't'
          # build disables it by default, and an extension that lacks free-threading support
          # would otherwise turn it back on, with a RuntimeWarning in pytest's summary that the
          # cell does not fail on). Empty on every other cell, which CPython reads as unset.
          PYTHON_GIL: ${{ endsWith(matrix.python-version, 't') && '0' || '' }}
        # T230b: a hung test used to be 15 minutes of silence (five jobs since 2026-08-27, a
        # process-global time.sleep patch consumed by a foreign thread). pytest-timeout turns the
        # NEXT stall into a named failure with every thread's stack: thread method = guaranteed
        # termination (the process ends; the dump's bottom frame is the blocked primitive, and the
        # hung test is the lowest tests/ frame above the _pytest/runner frames) - the signal
        # method cannot interrupt a C call. 600 s strictly exceeds the slowest legitimate test
        # (~122 s, leak-scaled) and the 300 s child timeout in test_session_move_live. Its timer
        # waits on an Event, so it can never itself consume a patched sleep. --durations names the
        # slowest tests on every run so a creeping one is visible before it stalls.
        # -p no:anyio: the SDK step's closure carries anyio, whose pytest plugin would otherwise
        # auto-load in this process and in every pytest child the suite spawns in this interpreter
        # (the launchers under tests/ pass the same flag); the SDK step's comment states the decision
        # and its measurement, and tests/test_ci_sdk_pin.py holds the flag on every pytest invocation
        # in this file (its population check) and on the launchers under tests/ its launcher census reads.
        run: python -m pytest -q -p no:anyio --durations=10 --timeout=600 --timeout-method=thread

  shell:
    name: Shell (bats, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Generous vs the python jobs on purpose: the suite takes ~1min on Linux but
    # ~16min on macOS, so anything near 15 would kill a PASSING job.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # macOS only on a manual run (workflow_dispatch) or the weekly schedule; see the header note.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      # bats comes from the pinned release tarball, NOT apt: an Azure apt-mirror outage hung
      # `apt-get update` to the job timeout three runs in a row (2026-08-19, ~35 wasted minutes
      # each). GitHub itself is already on the critical path (checkout), so this adds no new
      # dependency — and no bats test needs a tool the runner image lacks: node, python3 and curl are
      # on the GitHub images (the manager suites run the real bin/romp-manager under node; romp.bats and
      # install-sh.bats run python3 and curl), the rest mock their subjects on PATH; gitleaks, two steps
      # below, is the one extra install, for tests/gitleaks-config.bats. The step timeout kills any
      # residual network hang in minutes instead of letting it eat the job's budget.
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          curl -fsSL --retry 3 -o /tmp/bats.tar.gz \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.11.1.tar.gz
          tar -xzf /tmp/bats.tar.gz -C /tmp
          sudo /tmp/bats-core-1.11.1/install.sh /usr/local
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install bats-core
      - name: Install gitleaks (Linux)
        # tests/gitleaks-config.bats skips itself when gitleaks is absent, so without this step the
        # repo's scanning rules (.gitleaks.toml: the value-anchored allowlist, the merge-commit scan)
        # would be checked nowhere; ROMP_GITLEAKS_REQUIRE=1 on the Run bats step below turns that
        # skip into a red job, so a broken install cannot ship as green skips. The same pinned,
        # checksummed release the secrets job installs; bump the two version/sha pairs together.
        # Linux only: the macOS cell is manual (see the header), and one arbiter is enough.
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Run bats
        # A per-test bound from bats itself (BATS_TEST_TIMEOUT, since bats-core 1.8: a background sleep,
        # then pkill or ps on the test's children), so one hung test fails in minutes and is NAMED in the
        # TAP line ("# timeout after Ns") instead of eating the job's whole budget and being cancelled
        # nameless at the ceiling (the macOS leg, 2026-09-16: every dispatch cut at 35 minutes). No
        # coreutils timeout is involved, which the macOS image lacks. The bound is generous against the
        # slowest legitimate test on macOS (the romp-serve probe tests hold 60 s by design).
        env:
          BATS_TEST_TIMEOUT: "180"
          # ROMP_GITLEAKS_REQUIRE=1 on Linux only: the Linux cell installs the pinned gitleaks in the
          # step above, so tests/gitleaks-config.bats skipping there would hide a broken install
          # behind ten green skips; with the switch its setup() fails and names the reason. macOS
          # has no install step and may keep skipping. Off-Linux the expression yields an empty
          # value, which the file reads as the switch unset (the PYTHON_GIL idiom above).
          ROMP_GITLEAKS_REQUIRE: ${{ runner.os == 'Linux' && '1' || '' }}
        run: bats --print-output-on-failure tests/*.bats
      # T224: the manager<->kernel handshake proof (tests/manager-*.test.js: restart coalescing, the
      # quiet-window chain, the drain-lease refusal notices) ran only by hand until now. It runs HERE,
      # inside a check the upstream ruleset already REQUIRES, so a red handshake blocks the merge -
      # a standalone job would have gone red while auto-merge landed the PR anyway (the ruleset lists
      # six contexts and adding one is an owner-side change). node's built-in runner, no deps, no
      # continue-on-error; the runtime is pinned so the step never rides whatever node the image has.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manager handshake tests (node --test)
        run: node --test tests/manager-*.test.js
      # The node-side tests of the file-comments loop (plans/file-review.md, Slice 1): the vendored
      # track-changents copy's drift test (pin plus patch series, tools/vendor-drift.test.mjs), the
      # behaviour tests for its patches, the file-comments host script, and the vendored guard's own
      # suite (which now spawns the guard as a process). Same pinned node as the step above; nothing
      # else under tools/ or vendor/ runs anywhere in CI, so this is their only runner.
      - name: Vendored tooling and host-script tests (node --test)
        run: node --test tools/*.test.mjs vendor/track-changents/hooks/*.test.mjs

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # About a minute in practice (a full-history checkout, then two scans); the cap exists so a
    # wedged download cannot burn the 6h default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The load-bearing line. A secret's whole problem is that history is permanent, so the
          # scan has to see history: the default depth-1 checkout would scan one commit and report
          # no leaks for a repo with a token three commits back. Depth 0 also brings every branch
          # and tag, which is what the --all below reads.
          fetch-depth: 0
      - name: Install gitleaks
        # Pinned, and checksummed against the publisher's own release manifest
        # (gitleaks_<version>_checksums.txt), rather than the marketplace action: a step that exists
        # to keep secrets out of the repo should not hand a token to a third-party action, and
        # gitleaks-action needs a licence key for organisation-owned repos. To bump, change both
        # lines together (here and in the shell job above), or the checksum check fails loudly.
        timeout-minutes: 5
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan every commit
        # The repo's rules, named explicitly, as the hook names them: without --config gitleaks
        # reads a GITLEAKS_CONFIG from the environment before the source root, and a missing file
        # would scan under the default rules in silence; named, a missing file fails the step.
        # -v prints the file, line and rule of each hit; without it gitleaks reports a bare count,
        # so a red job would not say what to fix. --redact so a hit does not reprint the secret
        # into a public build log, where it would be MORE exposed than in the commit that tripped
        # the scan. --all reads every branch and tag the checkout brought, not only the pushed
        # ref. --diff-merges=first-parent: `gitleaks git` runs `git log -p`, which omits
        # merge-commit diffs, so a secret introduced only in a merge (a conflict resolution) is
        # invisible to --all alone; the tree scan below catches it only while it is still at HEAD;
        # this surfaces it in history for good. --text: that same `git log -p` reads the checkout's
        # .gitattributes, and a path marked -diff prints a `Binary files ... differ` line with no
        # hunk, so a secret committed in such a path and removed in a later commit is text this scan
        # never sees while the tree scan below reads HEAD, where it is gone; --text prints the diff
        # regardless of the attribute. Latent here today: the one committed .gitattributes
        # (ui/webview/anchor-map-fixtures/.gitattributes) marks a fixture -text, for its line
        # endings, not -diff. Other plain-stream options (--no-color, --no-textconv, --no-ext-diff)
        # guard against a developer's git config; no step of this workflow configures color, textconv
        # or a diff driver (actions/checkout's config writes touch nothing about diff output), so here
        # they would be defence in depth, not load-bearing.
        # The committed attribute is the input this repository carries itself, and --text is its
        # option. A finding exits nonzero and fails the step.
        run: gitleaks git . --no-banner --redact -v --config .gitleaks.toml --log-opts="--all --diff-merges=first-parent --text"
      - name: Scan the tree as it stands
        # The history scan reads commit diffs, so a secret in a file that is present but untouched
        # by any scanned commit (a submodule tip, a file added before a rewrite) is only caught by
        # scanning the tree itself. Runs after a red history scan too, so one run reports both.
        if: ${{ !cancelled() }}
        run: gitleaks dir . --no-banner --redact -v --config .gitleaks.toml

  vscode-extension:
    name: vscode-extension (typecheck + test + build)
    runs-on: ubuntu-latest
    # Time-boxed like the Python jobs above, and for the same reason the cap must EXCEED the phase it
    # guards plus the 600 s per-test timeout plus setup. This job's long phase is the served-page
    # pytest step below, which grows with every served lab added (the focused section's, the widgets',
    # the held-answer federation lab). Measured from the Actions API (2026-09-14): main's run
    # 34812968222 took the job 14 min 42 s with the served step alone at 12 min 44 s, seconds under the
    # old 15 min; PR 1598's run 34809524051 was CANCELLED at 15 min 16 s with the served step killed
    # at 13 min 14 s and every earlier step green, so a PR adding a lab, or a slow runner, read as a
    # red. 25 min = 13 min of labs + 600 s for one stalled test + setup, with margin; the served step
    # names its slowest labs (--durations=20) so the next growth is visible in the log. The labs kept
    # growing: PR 1790's run 35138058863 was cancelled at 25 min 04 s mid served-lab on a slow runner,
    # every step green up to the cut (2026-09-16). 40 min: the served step's 20-odd minutes on a slow
    # runner plus the 600 s per-test timeout plus setup.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          # Resolved from the REPO ROOT, not from defaults.run.working-directory.
          # A wrong path here fails the job outright ("Some specified paths were
          # not resolved"), which is what a stale chat-view/ path did until the
          # directory was renamed to vscode-extension/.
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: PDF renderer dependency smoke test (node --test)
        # tools/pdf-smoke.test.mjs opens a synthetic PDF with the pdfjs-dist this job's npm ci installed
        # (plans/file-review.md, Slice 4). The shell job's tools/*.test.mjs step picks the file up too, but
        # that job installs nothing, so the test SKIPS there by design and asserts here. Repo root: the
        # test locates node_modules relative to itself.
        working-directory: ${{ github.workspace }}
        run: node --test tools/pdf-smoke.test.mjs
      - name: Build
        run: npm run build
      - name: Cache Playwright's browsers
        # Keyed on the lockfile, so the download below runs once per playwright version.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('vscode-extension/package-lock.json') }}
      - name: Install the pinned Playwright Chromium
        # The pane bench below needs a browser. It is playwright's own download for the version
        # package-lock pins (1.62.x fetches its matching Chromium build, about 150 MB, cached above), NOT
        # the runner image's Google Chrome: the image's browser is unpinned and auto-updated, so a Chrome
        # release the pinned driver cannot speak, or an image without one, would have turned this REQUIRED
        # check red with no change in the repo (review find, 2026-09-08). The same stance as the node pin
        # above: the step never rides whatever the image has. No --with-deps: that runs apt, which the bats
        # step stopped trusting after a mirror outage, and the shared libraries Chromium needs come with
        # the image. tools/ui-bench.mjs prefers this browser to any system Chrome, and the step's log says
        # which one ran ("browser: playwright chromium").
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Dashboard pane bench (node --test)
        # tools/ui-bench.mjs replays a synthetic frame stream into the real feed and timeline pages in the
        # headless Chromium installed above, served by the kernel's own page route from the dist the Build
        # step just wrote; python3 comes with the image (every Ubuntu image ships one inside the kernel's
        # 3.10 to 3.13 range, which the Python cells above cover). The test file lives at the repo root,
        # hence the working-directory override of the job's vscode-extension/ default. On a contributor's
        # machine the browser tests skip, and say why, when no browser, python3 or dist is present. Here
        # ROMP_UI_BENCH_REQUIRE makes that skip a failure: this is the only CI run of the real pane
        # bundles, and a runner without the browser or python3 must turn the job red rather than green
        # with the coverage gone (the same stance as the cryptography install above, which exists so its
        # tests RUN). The replays assert only what holds under any scheduling (totals, ordering, the
        # handoff's accounting); the timing relations are assertions only under ROMP_UI_BENCH_TIMING,
        # which this step deliberately leaves unset: a shared runner's scheduler is not what the required
        # check measures (review find, 2026-09-08).
        working-directory: ${{ github.workspace }}
        env:
          ROMP_UI_BENCH_REQUIRE: "1"
        run: node --test tests/ui-bench.test.mjs
      - uses: actions/setup-python@v5
        # For the served-page tests below: the image's python3 would do, but its pip refuses to install
        # into the system interpreter, and pytest is not on the image.
        with:
          python-version: '3.12'
      - name: Browser-backed served-page tests (pytest)
        # tests/test_*_browser.py and tests/test_*_served.py boot a hermetic kernel and drive the real
        # dashboard pages in the headless Chromium installed above; on the Python matrix runners (no
        # node deps, no browser) they skip, and say why, so a served-page regression never turned CI
        # red (the deep-link landing pin, 2026-09-10: red on main, CI green). This is the one job that
        # has the browser and the built dist, so they run HERE, one pytest process, with
        # ROMP_SERVED_TESTS_REQUIRE=1 turning any skip in those files into a failure that carries the
        # skip's reason (tests/conftest.py; the same stance as ROMP_UI_BENCH_REQUIRE above): a runner
        # without the browser, the deps or a serving kernel turns the job red rather than green with
        # the coverage gone. cryptography is what the push tests' kernel needs, as in the Python jobs.
        # ROMP_SERVED_TESTS_ENGINES names the one engine this job installs: the pane-hiding test drives
        # Chromium, Firefox and WebKit, and its legs for engines a runner declares it does not have skip
        # as "optional", which the switch leaves alone (WebKit's system libraries would need apt, which
        # this step does not run; see the install step above). The matrix jobs are unchanged: still no
        # browser, still skipping these. --durations=20 names the slowest labs in the log: this step is
        # the job's long phase (12 min 44 s on main, 2026-09-14, against the job's cap above), and every
        # served lab added grows it, so the next growth should be visible by name.
        # -p no:anyio, as on every pytest invocation in this file (tests/test_ci_sdk_pin.py's population
        # check holds the flag on each, with no exemption): this interpreter has no anyio today (the pip
        # line below installs pip, pytest, pytest-timeout and cryptography, none of which depends on it;
        # run 35535192879's served step installed nine packages, none anyio) and pytest accepts the flag
        # where the plugin is absent, so the flag costs nothing here and a package added to that line
        # whose closure carries anyio cannot auto-load its pytest plugin without a word. No
        # ROMP_SDK_REQUIRE: the switch declares that the interpreter running pytest has the SDK the Python
        # job's install step put there, and this job installs none, so setting it would declare something
        # untrue; the population check lists this step for the switch with that reason and checks its
        # premises (no SDK install in this job's run blocks; no file the two globs collect, and no helper
        # module under tests/ they could import, conftest included, spells the switch's name), so the day a
        # served module spells the switch's name the listing goes red (keyed on the spelling in the file's
        # text: a reader that spells the name indirectly is outside that read).
        working-directory: ${{ github.workspace }}
        env:
          ROMP_SERVED_TESTS_REQUIRE: "1"
          ROMP_SERVED_TESTS_ENGINES: chromium
        run: |
          python -m pip install --upgrade pip pytest pytest-timeout cryptography
          python -m pytest tests/test_*_browser.py tests/test_*_served.py -q -rs -p no:cacheprovider -p no:anyio --durations=20 --timeout=600 --timeout-method=thread
